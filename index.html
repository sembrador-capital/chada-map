/* Qué controles corresponden al modo. Vive aparte de cambiarModo porque el
   arranque también lo necesita: al cargar, la pestaña activa es Vista general y
   nadie ha hecho clic, así que sin esto el botón Modelo quedaba visible y abría
   un panel financiero vacío. */
/* Los dos encimamientos del chrome, resueltos igual: midiendo, no adivinando.
   Un umbral en píxeles se queda corto o sobra según el modo, porque cada uno
   trae distintos controles y distintos rótulos en la barra de métricas.

   1) La barra de controles envuelve cuando el mapa se estrecha, y al ganar una
      segunda fila se monta sobre el panel de leyenda, que arranca a la misma
      altura.
   2) La barra de métricas vive arriba a la derecha y las pestañas al centro.
      Con el panel abierto quedan unos 700 px de mapa y las dos se pisaban: en
      Vista general la barra tapaba media pestaña de «Suelos». Se baja al pie,
      que es donde ya vive en los modos de dato.

   Se mide con la clase quitada para leer la posición natural; si no, una vez
   abajo nunca volvería a subir. */
function acomodarChrome() {
    document.body.classList.remove('stats-abajo');
    const tb = $('tabs').getBoundingClientRect(), sb = $('statsBar').getBoundingClientRect();
    if (sb.width && sb.left < tb.right + 10 && sb.top < tb.bottom) document.body.classList.add('stats-abajo');

    const leyenda = $('legend'), controles = document.querySelector('.controls');
    leyenda.style.top = '';
    const c = controles.getBoundingClientRect(), l = leyenda.getBoundingClientRect();
    if (c.left < l.right + 8 && c.bottom > l.top) leyenda.style.top = Math.round(c.bottom + 8) + 'px';
}

function sincronizarControles() {
    const conTemporada = modo === 'produccion' || modo === 'financiero';
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.modo === modo));
    document.body.classList.toggle('modo-dato', modo !== 'general');
    $('grpColor').hidden = modo !== 'general';
    $('grpMetrica').hidden = modo !== 'financiero';
    $('grpSubSuelo').hidden = modo !== 'suelos';
    $('grpSuelo').hidden = modo !== 'suelos';
    // El terreno y el suelo no cambian con la temporada: el selector sugeriría
    // que la pendiente se mueve entre 2025 y 2029.
    $('grpTemporada').hidden = !conTemporada;
    acomodarChrome();
}

function cambiarModo(nuevo) {
    modo = nuevo;
    sincronizarControles();
    repintar();
}

function togglePanel(abrir) {
    document.body.classList.toggle('panel-abierto', abrir);
    $('btnPanel').classList.toggle('abierta', abrir);

}

document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => cambiarModo(b.dataset.modo)));

    // Cada cara arranca en su primera variable: dejar seleccionada una del otro
    // grupo dejaría el selector mostrando algo que ya no existe.

    $('segSuelo').querySelectorAll('button').forEach(x => x.classList.toggle('activo', x === b));
    construirSelectores();

$('btnPanel').addEventListener('click', () => togglePanel(!panelAbierto()));
$('panelAsa').addEventListener('click', () => togglePanel(true));
$('mpCerrar').addEventListener('click', () => togglePanel(false));
document.querySelectorAll('.mp-sect-head').forEach(h => h.addEventListener('click', () => {
    h.closest('.mp-sect').classList.toggle('abierta');

}));

    document.querySelectorAll('.mp-chart-tab').forEach(x => x.classList.toggle('active', x === b));
    vistaGrafico = b.dataset.vista;

$('btnTodo').addEventListener('click', () => { Object.keys(MODELOS_DE_VKEY).forEach(k => visibles.add(k)); aplicarFiltro(); });
$('btnNada').addEventListener('click', () => { visibles.clear(); aplicarFiltro(); });

const conmutar = (id, fn) => $(id).addEventListener('change', e => fn(e.target.checked));
const vis = (capa, on) => { if (map.getLayer(capa)) map.setLayoutProperty(capa, 'visibility', on ? 'visible' : 'none'); };
conmutar('swRelleno',   on => vis('cuarteles-fill', on));
conmutar('swContorno',  on => vis('cuarteles-line', on));
$('segEtiqueta').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    etiqueta = b.dataset.etq;
    $('segEtiqueta').querySelectorAll('button').forEach(x => x.classList.toggle('activo', x === b));
    aplicarEtiqueta();
}));
conmutar('swLeyenda',   on => document.body.classList.toggle('legend-off', !on));
conmutar('swMetricas',  on => { $('statsBar').style.display = on ? 'flex' : 'none'; });
conmutar('swSatelital', on => { estiloSatelital = on; map.setStyle(on ? ESTILO_SAT : ESTILO_CLARO); });
conmutar('swSombreado', on => vis('sombreado', on));
conmutar('swRelieve',   on => aplicarRelieve(on));

function cerrarVista() {
    $('popVista').hidden = true;
    $('btnVista').classList.remove('abierta');
    $('btnVista').setAttribute('aria-expanded', 'false');
}
$('btnVista').addEventListener('click', () => {
    if (!$('popVista').hidden) return cerrarVista();
    $('popVista').hidden = false;
    $('btnVista').classList.add('abierta');
    $('btnVista').setAttribute('aria-expanded', 'true');
});
document.addEventListener('click', e => {
    if (!e.target.closest('.fc-pop-wrap') && !$('popVista').hidden) cerrarVista();
});

$('btnEncuadrar').addEventListener('click', () => encuadrar(true));

/* El relleno se calcula contra el tamaño real del mapa, no con números fijos.
   Con el panel abierto el mapa baja a ~700 px y un relleno izquierdo de 300 px
   —el ancho de la leyenda— más 60 a la derecha se come más de la mitad del
   ancho: ahí Mapbox deja de encuadrar y el predio se sale de la vista.

   Y bajo 1180 px el panel deja de quitarle ancho al mapa y se monta encima: el
   canvas sigue midiendo lo mismo, así que «Ver todo el predio» encuadraba
   contra un ancho que en pantalla no existe y dejaba el tercio oriente —los
   cerezos del cerro— escondido detrás del panel. Cuánto tapa se mide, no se
   supone: así vale igual cuando el panel sí cede ancho (tapa = 0). */
function relleno() {
    const c = map.getContainer(), w = c.offsetWidth, h = c.offsetHeight;
    const tapa = panelAbierto()
        ? Math.max(0, Math.round(c.getBoundingClientRect().right - $('modeloPanel').getBoundingClientRect().left))
        : 0;
    let der = tapa + Math.min(60, Math.round(w * 0.08));
    let izq = document.body.classList.contains('legend-off') ? 24 : Math.min(300, Math.round(w * 0.3));
    // Si entre los dos no dejan aire, el que cede es el de la leyenda: la
    // leyenda sólo estorba y se puede plegar, mientras que lo que queda bajo el
    // panel no hay forma de verlo.
    const tope = Math.round(w * 0.72);
    if (izq + der > tope) izq = Math.max(24, tope - der);
    if (izq + der > tope) der = Math.max(24, tope - izq);
    return {
        left: izq, right: der,
        top: Math.min(108, Math.round(h * 0.15)),
        bottom: Math.min(80, Math.round(h * 0.12))
    };
}

function encuadrar(animar) {
    const b = GEO.bbox;
    map.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: relleno(), duration: animar ? 800 : 0 });
}

/* ── Búsqueda ───────────────────────────────────────────────────────────── */
/* Cinco códigos aparecen en más de un polígono (5127, 5137, 5213, 8201, 8209).
   Si la sugerencia fuera sólo «código — variedad», dos paños distintos darían la
   misma línea y el buscador se quedaría siempre con el primero. El ID interno
   desempata, y sólo aparece donde hace falta. */
function construirDatalist() {
    const repetidos = new Set((GEO.avisos || {}).codigos_repetidos || []);
    $('dlCuarteles').innerHTML = GEO.cuarteles.features.map(f => {
        const p = f.properties;
        const choca = p.cuarteles.some(c => repetidos.has(c));
        return `<option value="${esc(etiquetaBusqueda(p))}"${choca ? ` label="${esc(p.uid)}"` : ''}></option>`;
    }).join('');
}

const etiquetaBusqueda = p => {
    const repetidos = new Set((GEO.avisos || {}).codigos_repetidos || []);
    const choca = p.cuarteles.some(c => repetidos.has(c));
    return p.cuartel + ' — ' + p.variedad + (choca ? ' · ' + p.uid : '');
};

/* Dos niveles de calce. El exacto es el que dispara solo, mientras se escribe:
   es lo que pasa al elegir una sugerencia de la lista. El aproximado —prefijo
   de código o de variedad— espera a Enter o a que el campo pierda el foco,
   porque si no el mapa volaba en cada tecla: escribir «5218» hacía tres viajes,
   uno por cada dígito a partir del segundo, y ninguno al cuartel buscado. */
function buscar(texto, permisivo) {
    const q = texto.trim().toLowerCase();
    if (q.length < 2) return;
    const norm = x => x.toLowerCase();
    const c = GEO.cuarteles.features;
    let f = c.find(x => norm(etiquetaBusqueda(x.properties)) === q)
        || c.find(x => norm(x.properties.cuartel) === q)
        || c.find(x => x.properties.cuarteles.some(y => norm(y) === q));
    if (!f && permisivo) {
        f = c.find(x => norm(x.properties.cuartel).startsWith(q))
            || c.find(x => norm(x.properties.variedad).startsWith(q))
            || c.find(x => norm(x.properties.variedad).includes(q));
    }
    // Un Enter que no hace nada se lee como que la app se colgó.
    if (!f) { if (permisivo) avisar('No hay ningún cuartel ni variedad que calce con «' + texto.trim() + '».'); return; }

    const k = vkey(f.properties.especie, f.properties.variedad);
    if (!visibles.has(k)) { visibles.add(k); aplicarFiltro(); }
    map.flyTo({ center: f.properties.centro, zoom: 16.4, duration: 900 });
    map.once('moveend', () => {
        setEstado(fijado, 'fijo', false);
        fijado = f.properties.uid; setEstado(fijado, 'fijo', true);
        mostrarFicha(f.properties, map.project(f.properties.centro), true);
    });
}

$('inpBuscar').addEventListener('input', e => buscar(e.target.value, false));
$('inpBuscar').addEventListener('change', e => buscar(e.target.value, true));
$('inpBuscar').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); buscar(e.target.value, true); }
});

let relojAviso = null;
function avisar(texto) {
    const a = $('aviso');
    a.textContent = texto;
    a.hidden = false;
    clearTimeout(relojAviso);
    relojAviso = setTimeout(() => { a.hidden = true; }, 4200);
}

/* Atajos. Sólo cuando el foco no está en un campo: si no, escribir «5218-D» en
   el buscador cambiaría de pestaña cuatro veces antes de llegar a la D. Están
   listados en Vista ▸ Atajos, porque un atajo que nadie sabe que existe no es
   un atajo. */
const TECLA_MODO = { '1': 'general', '2': 'produccion', '3': 'financiero', '4': 'suelos' };
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        desfijar();
        if (!$('popVista').hidden) cerrarVista();
        return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    // El objetivo de un keydown a nivel de documento no siempre es un Element
    // -puede ser el propio document-, y ahi .closest no existe y el manejador
    // reventaba entero antes de llegar a ningun atajo. Se cae a activeElement,
    // que es lo que de verdad interesa: si el foco esta en un campo, la tecla
    // es texto y no un atajo.
    const foco = e.target instanceof Element ? e.target : document.activeElement;
    if (foco && foco.closest('input, select, textarea, [contenteditable]')) return;
    if (TECLA_MODO[e.key]) return cambiarModo(TECLA_MODO[e.key]);
    const k = e.key.toLowerCase();
    if (k === 'd') togglePanel(!panelAbierto());
    else if (k === 'l') { $('swLeyenda').checked = !$('swLeyenda').checked; $('swLeyenda').dispatchEvent(new Event('change')); }
    else if (k === 'f') encuadrar(true);
});
</script>
