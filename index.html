    map.setLayerZoomRange('cuarteles-label', variedad ? 13.3 : 14.2, 24);
}

/* El 3D se paga en legibilidad: al inclinar la cámara los cuarteles del fondo
   se aplastan y las etiquetas se amontonan. Por eso viene apagado y, cuando se
   enciende, la inclinación es moderada. */
function aplicarRelieve(on) {
    relieve = on;
    if (!map.getSource('dem')) return;
    map.setTerrain(on ? { source: 'dem', exaggeration: 1.3 } : null);
    map.easeTo({ pitch: on ? 55 : 0, duration: 600 });
}

/* Se corre una sola vez: los listeners viven en el mapa, no en el estilo.
   Cambiar de base descarta fuentes y capas, así que el remontaje se cuelga de
   'style.load'. Con 'styledata' no alcanza: se emite antes de que el estilo
   esté listo y addSource falla. */
function inicializar() {
    map.on('style.load', montarCapas);
    montarCapas();
    encuadrar(false);
    $('loader').hidden = true;

    // Redimensionar el canvas cuando cambia el contenedor. Va SÍNCRONO, no en
    // requestAnimationFrame: si la pestaña no está pintando esos frames no
    // llegan y el canvas se queda con el ancho viejo, dejando una franja muerta
    // a la derecha. La guarda por ancho evita el bucle -cambiar el canvas, que
    // es hijo de #map, no altera el contentRect del padre, pero más vale no
    // depender de eso-.
    let anchoPrevio = 0;
    new ResizeObserver(entradas => {
        const ancho = Math.round(entradas[0].contentRect.width);
        if (ancho === anchoPrevio) return;
        anchoPrevio = ancho;
        map.resize();
        acomodarChrome();
    }).observe($('map'));
    // El observador sólo mira el mapa; la barra de controles también reordena
    // sus filas cuando cambia el ancho de la ventana sin que el mapa cambie.
    window.addEventListener('resize', acomodarChrome);

    map.on('mousemove', 'cuarteles-fill', onHover);
    map.on('mouseleave', 'cuarteles-fill', onLeave);
    map.on('click', 'cuarteles-fill', onClick);
    map.on('mousemove', 'pozos-circle', onHoverPozo);
    map.on('mouseleave', 'pozos-circle', onLeavePozo);
    map.on('click', 'pozos-circle', onClickPozo);
    map.on('click', e => {
        if (sobrePozo(e.point)) return;
        if (!map.queryRenderedFeatures(e.point, { layers: ['cuarteles-fill'] }).length) desfijar();
    });
    // Mapbox emite 'mouseleave' de capa sólo si el puntero sigue sobre el
    // canvas. Al pasar del polígono a la leyenda o a los controles —que son
    // overlays HTML— no se entera, y la ficha quedaba colgada.
    $('map').addEventListener('mouseleave', onLeave);
}

/* ── Interacción ────────────────────────────────────────────────────────── */
const setEstado = (uid, clave, valor) => { if (uid != null) map.setFeatureState({ source: 'cuarteles', id: uid }, { [clave]: valor }); };

/* ¿Hay un pozo bajo el cursor? Casi todos caen dentro o al borde de un
   cuartel, y las dos capas reciben el mismo evento: sin esta pregunta, la
   ficha del cuartel pisaba la del pozo en cada movimiento. */
const sobrePozo = punto => pozosVisibles() && !!map.getLayer('pozos-circle') &&
    map.queryRenderedFeatures(punto, { layers: ['pozos-circle'] }).length > 0;

function onHover(e) {
    if (!e.features.length) return;
    if (sobrePozo(e.point)) { setEstado(hoverId, 'hover', false); hoverId = null; return; }
    const f = e.features[0];
    map.getCanvas().style.cursor = 'pointer';
    if (hoverId !== f.properties.uid) {
        setEstado(hoverId, 'hover', false);
        hoverId = f.properties.uid;
        setEstado(hoverId, 'hover', true);
    }
    if (!fijado && !pozoFijo) mostrarFicha(f.properties, e.point);
}
function onLeave() {
    if (!pozoHover) map.getCanvas().style.cursor = '';
    setEstado(hoverId, 'hover', false); hoverId = null;
    if (!fijado && !pozoFijo && !pozoHover) ocultarFicha();
}
function onClick(e) {
    if (!e.features.length || sobrePozo(e.point)) return;
    const p = e.features[0].properties;
    soltarPozo();
    setEstado(fijado, 'fijo', false);
    fijado = p.uid; setEstado(fijado, 'fijo', true);
    mostrarFicha(p, e.point, true);
}
function desfijar() { setEstado(fijado, 'fijo', false); fijado = null; soltarPozo(); ocultarFicha(); }

let pozoHover = null, pozoFijo = null;
const setEstadoPozo = (pid, valor) => { if (pid != null && map.getSource('pozos')) map.setFeatureState({ source: 'pozos', id: pid }, { hover: valor }); };
function soltarPozo() { if (pozoFijo && pozoFijo !== pozoHover) setEstadoPozo(pozoFijo, false); pozoFijo = null; }

function onHoverPozo(e) {
    if (!e.features.length) return;
    const p = e.features[0].properties;
    map.getCanvas().style.cursor = 'pointer';
    if (pozoHover !== p.pid) { if (pozoHover !== pozoFijo) setEstadoPozo(pozoHover, false); pozoHover = p.pid; setEstadoPozo(pozoHover, true); }
    if (!fijado && !pozoFijo) mostrarPozo(p, e.point);
}
function onLeavePozo() {
    if (pozoHover !== pozoFijo) setEstadoPozo(pozoHover, false);
    pozoHover = null;
    // Si al salir del pozo el cursor quedó sobre un cuartel, su ficha ya se
    // pintó en este mismo movimiento: no hay que esconderla.
    if (hoverId) return;
    map.getCanvas().style.cursor = '';
    if (!fijado && !pozoFijo) ocultarFicha();
}
function onClickPozo(e) {
    if (!e.features.length) return;
    const p = e.features[0].properties;
    setEstado(fijado, 'fijo', false); fijado = null;
    soltarPozo();
    pozoFijo = p.pid; setEstadoPozo(pozoFijo, true);
    mostrarPozo(p, e.point, true);
}

/* La ficha del pozo usa la misma tarjeta que la del cuartel, con lo único que
   el KMZ dice de él: el nombre, si está en uso y, cuando lo anota, el caudal.
   Lo que no está escrito no se completa. */
function mostrarPozo(p, punto, fija = false) {
    const card = $('card');
    const [lon, lat] = (GEO.pozos.features.find(f => f.properties.pid === p.pid) || { geometry: { coordinates: [] } }).geometry.coordinates;
    const kv = (k, v) => `<div class="card-kv"><span class="card-k">${k}</span><span class="card-v">${v}</span></div>`;
    card.innerHTML = `
        <div class="card-head">
            <div class="card-especie"><i class="pozo-dot ${p.en_uso ? 'en-uso' : 'sin-uso'}"></i>Pozo</div>
            <div class="card-cuartel">${esc(rotuloPozo(p))}</div>
            <div class="card-variedad">${p.en_uso ? 'En uso' : 'Seco, sin uso'}</div>
            <button type="button" class="card-close" id="cardClose" aria-label="Cerrar"><svg viewBox="0 0 18 18" width="13" height="13"><use href="#ic-cerrar"/></svg></button>
        </div>
        <div class="card-body">
            ${kv('Nombre en el KMZ', esc(p.nombre))}
            ${p.caudal_ls != null ? kv('Caudal', nf(p.caudal_ls, 0) + ' l/s') : ''}
            ${lat != null ? kv('Ubicación', nf(lat, 5) + ', ' + nf(lon, 5)) : ''}
            <div class="card-hint">${fija ? 'Clic fuera para soltar' : 'Clic para fijar'}</div>
        </div>`;
    card.classList.toggle('fija', fija);
    card.classList.add('visible');
    if (fija) $('cardClose').onclick = desfijar;
    posicionarFicha(punto);
}

/* Mapbox serializa los arreglos de properties a string. */
const arr = v => { try { return typeof v === 'string' ? JSON.parse(v) : (v || []); } catch (_) { return []; } };
const obj = v => { try { return typeof v === 'string' ? JSON.parse(v) : (v || null); } catch (_) { return null; } };

/* La ficha muestra SOLO lo de la pestaña activa. Apilar modelo, terreno y suelo
   en todos los modos llenaba media pantalla con datos que nadie había pedido, y
   repetía dentro del cuerpo la especie y la variedad que ya están en la
   cabecera. Cada modo trae su bloque y sus avisos; nada más. */
function mostrarFicha(p, punto, fija = false) {
    const card = $('card');
    const variedades = arr(p.variedades), cuarteles = arr(p.cuarteles);
    const regs = arr(p.modelo).map(k => MIDX[k]).filter(Boolean);
    const su = obj(p.suelo);

    const signo = x => x == null ? '' : (x < 0 ? ' neg' : ' pos');
    const kv = (k, v, cls = '') => `<div class="card-kv"><span class="card-k">${k}</span><span class="card-v${cls}">${v}</span></div>`;
    const chip = (a, b) => `<div class="card-chip"><span>${a}</span><span>${b}</span></div>`;
    const sec = (tit, html) => html ? `<div class="card-sec"><div class="card-sec-tit">${tit}</div>${html}</div>` : '';
    /* Las hectáreas dibujadas de ESTE paño. Van siempre, haya o no contraparte
       en el modelo: es lo único que describe al polígono que se está tocando.
       Es una medición del dibujo del KMZ y no entra en ningún total -la suma de
       los 174 paños da 330,81 ha contra las 284,02 del modelo-, así que va
       rotulada como lo que es y en gris, para que nadie la confunda con la
       superficie que manda. */
    const kvKmz = p => p.ha_kmz == null ? ''
        : `<div class="card-kv card-kv-sec"><span class="card-k">Este cuartel</span>` +
          `<span class="card-v">${nf(p.ha_kmz, 2)} ha dibujadas</span></div>`;

    let cuerpo = '';
    const avisos = [];

    if (modo === 'general') {
        const ha = regs.reduce((a, v) => a + v.ha, 0);
        const uno = regs.length === 1 ? regs[0] : null;
        const pl = uno && uno.plantaciones && uno.plantaciones.length ? uno.plantaciones : null;
        // La tasación anota "-" donde no registró portainjerto: es un hueco.
        const patrones = pl ? [...new Set(pl.map(b => b.portainjerto).filter(x => x && x !== '-'))] : [];
        cuerpo =
            (regs.length ? kv(variedades.length > 1 ? 'Variedades del cuartel' : 'Variedad',
                              nf(ha, 2) + ' ha en el modelo') : '') +
            kvKmz(p) +
            (uno ? kv('Plantación', esc(uno.anio_plantacion || '—')) +
                   (patrones.length ? kv('Portainjerto', esc(patrones.join(', '))) : '') +
                   (pl ? kv('Marco', esc(pl[0].marco || '—')) : '') : '') +
            (p.nota ? `<div class="card-nota">${esc(p.nota)}</div>` : '') +
            (variedades.length > 1
                ? sec('Variedades del cuartel', variedades.map((v, i) => chip(esc(v), esc(cuarteles[i] || '—'))).join(''))
                : '');
        if (p.arrendado) avisos.push('Cuartel <b>arrendado a terceros</b>: no entra en el análisis. El modelo dejó de contar su superficie; el KMZ lo dibuja plantado con ' + esc(p.variedad) + '.');
        else if (!regs.length) avisos.push('Sin contraparte en el modelo: el KMZ lo agrupa como <b>Disponible</b>, arrancado o no productivo.');
        if (p.aprox) avisos.push('Cruce aproximado: el nombre del KMZ no calza exacto con el del modelo y se cruzó por alias.');

        // En los demás modos el titular es otro -rendimiento, plata, suelo- y la
        // superficie no compite con él; acá sí, porque Vista general es la
        // pestaña de la identidad del cuartel.
    } else if (verCosecha()) {
        const conDato = regsConCosecha(regs, tc);
        const real = valorCosecha(p, tc);
        const meta = valorCuartel(p, 'rend_kg_ha', UTILES - 1);
        const kg = conDato.reduce((a, v) => a + v.cosecha.kg[tc], 0);
        // La unidad del cuartel, no la de la pantalla: ningún paño mezcla cajas
        // con kilos, así que su ficha siempre puede hablar en la del modelo.
        const f = factorDe(regs.length ? regs : conDato);
        cuerpo = kvKmz(p) + (conDato.length
            ? kv('Cosechado', rend(real, f)) +
              kv('Total', miles(kg / f) + (f > 1 ? ' cajas' : ' kg')) +
              (meta ? kv('Plena producción', rend(meta, f)) +
                      kv('Avance', pct(real / meta), real < meta ? ' neg' : ' pos') : '') +
              // Las tres temporadas seguidas, que es lo que muestra si el
              // cuartel viene subiendo o si tuvo un año malo.
              sec('Por temporada', MOD.cosechas.temporadas.map((nom, i) => {
                  const v = valorCosecha(p, i);
                  return chip(esc(nom.replace('-', '/')), v == null ? 'sin registro' : rend(v, f));
              }).join('')) +
              (regs.length > 1 ? sec('Por variedad', conDato.map(v =>
                  chip(esc(v.variedad), rend(v.cosecha.rend_kg_ha[tc], v.kg_por_unidad || 1))).join('')) : '') +
              (f > 1 ? `<div class="card-suelo-desc">Cajas de 8,2 kg, que es como el modelo lleva la uva de mesa.</div>` : '')
            : '');
        if (!conDato.length) avisos.push('Sin cosecha registrada en esta temporada.');
        const agr = conDato.filter(v => v.cosecha.agrupada);
        if (agr.length) avisos.push('<i>Fuente 2</i> mide juntas <b>' + esc(agr[0].cosecha.agrupada) +
            '</b>; el total se reparte entre las dos con el detalle de la Ficha Técnica, que sí las separa.');
        if (conDato.some(v => v.cosecha.difiere_de_ficha[tc])) {
            avisos.push('<b>Las dos fuentes no coinciden</b> en esta temporada: <i>Fuente 2 Rendimientos</i> y la Ficha Técnica dan cifras distintas. Acá va la de Fuente 2.');
        }

    } else if (modo === 'produccion') {
        cuerpo = kvKmz(p);
        const ultima = MOD.temporadas.length - 1;
        const f = factorDe(regs);
        const hoy = valorCuartel(p, 'rend_kg_ha', t), plena = valorCuartel(p, 'rend_kg_ha', ultima);
        // La fila de plena producción sólo aparece si dice algo distinto: en una
        // variedad ya adulta repetiría el mismo número dos veces.
        cuerpo +=
            kv('Rendimiento', rend(hoy, f)) +
            (Math.round(plena) !== Math.round(hoy) ? kv('En plena producción', rend(plena, f)) : '') +
            (f > 1 ? `<div class="card-suelo-desc">Cajas de 8,2 kg, que es como el modelo lleva la uva de mesa.</div>` : '') +
            (regs.length > 1 ? sec('Por variedad', regs.map(v =>
                chip(esc(v.variedad), rend(v.rend_kg_ha[t], v.kg_por_unidad || 1))).join('')) : '');
        if (regs.some(v => v.produccion_libro)) avisos.push('Producción despejada desde los ingresos: el bloque del libro trae corridas las filas de Uva Vinífera.');

    } else if (modo === 'financiero') {
        // La ficha muestra la familia que se está mirando y no las dos: mezclar
        // US$/ha con US$/kg en una misma columna de números obliga a leer la
        // unidad en cada fila para no restar peras con manzanas.
        const campo = porKilo()
            ? { a: 'ingreso_kg', b: 'costo_kg', c: 'ebitda_kg' }
            : { a: 'ingreso_ha', b: 'costo_ha', c: 'ebitda_ha' };
        const f = porKilo() ? usdkg : x => usd(x) + '/ha';
        const res = valorCuartel(p, campo.c, t), mg = valorCuartel(p, 'margen', t);
        cuerpo = kvKmz(p) + (regs.length
            ? kv('Ingresos', f(valorCuartel(p, campo.a, t))) +
              kv('Costos', f(valorCuartel(p, campo.b, t))) +
              kv(porKilo() ? 'Margen' : 'EBITDA', f(res), signo(res)) +
              kv('Margen s/ventas', pct(mg), signo(mg)) +
              (porKilo() ? kv('Producción', miles(valorCuartel(p, 'rend_kg_ha', t)) + ' kg/ha') : '') +
              (regs.length > 1 ? sec('Por variedad', regs.map(v =>
                  chip(esc(v.variedad), f(v[campo.c][t]))).join('')) : '')
            : '');
        if (p.arrendado) avisos.push('Cuartel <b>arrendado a terceros</b>: no entra en el análisis. El modelo dejó de contar su superficie; el KMZ lo dibuja plantado con ' + esc(p.variedad) + '.');
        else if (!regs.length) avisos.push('Sin contraparte en el modelo: el KMZ lo agrupa como <b>Disponible</b>, arrancado o no productivo.');
        if (mezclaSignos(p)) {
            const dentro = regs.filter(v => clavesRent.has(vkey(v.especie, v.variedad))).map(v => v.variedad);
            const fuera = regs.filter(v => !clavesRent.has(vkey(v.especie, v.variedad))).map(v => v.variedad);
            avisos.push('Este cuartel lleva variedades de los <b>dos signos</b> y el paño es uno solo: ' +
                'pasa el filtro por ' + dentro.map(esc).join(', ') + ', y también tiene ' + fuera.map(esc).join(', ') +
                '. El color es el del cuartel completo, no el de la variedad que lo dejó entrar.');
        }

    } else if (verTerreno()) {
        cuerpo = kvKmz(p) +
            kv('Pendiente', nf(p.pendiente, 1) + '% · ' + esc(p.pendiente_clase)) +
            kv('Pendiente p90', nf(p.pendiente_p90, 1) + '%') +
            kv('Elevación', miles(p.elev) + ' m') +
            kv('Rango', miles(p.elev_min) + '–' + miles(p.elev_max) + ' m') +
            kv('Exposición', esc(p.exposicion || '—'));

    } else if (verFisico()) {
        cuerpo = kvKmz(p) + (su
            ? kv('Tipo', esc((SUELO[su.clase] || {}).nombre || su.clase)) +
              kv('Textura', esc(su.textura)) +
              kv('1er horizonte', miles(su.prof_cm) + ' cm') +
              kv('Pedregosidad', esc(su.pedregosidad)) +
              `<div class="card-suelo-desc">${esc(su.descripcion)}</div>` +
              (su.mezcla && su.mezcla.length > 1
                  ? sec('Mezcla del cuartel', su.mezcla.filter(m => m.pct >= 0.02).map(m =>
                        chip(`<i class="lg-dot" style="display:inline-block;vertical-align:-1px;margin-right:5px;background:${(SUELO[m.clase] || {}).color}"></i>` +
                             esc((SUELO[m.clase] || {}).nombre || m.clase), pct(m.pct))).join(''))
                  : '')
            : '');
        if (su && su.pct < 0.6) avisos.push('Cruza dos sectores sin que ninguno mande: la lectura buena es la mezcla, no el tipo dominante.');
    }

    card.innerHTML = `
        <div class="card-head">
            <div class="card-especie"><i class="lg-dot" style="background:${colorCuartel(p)}"></i>${esc(p.especie)}</div>
            <div class="card-cuartel">Cuartel ${esc(p.cuartel)}</div>
            <div class="card-variedad">${esc(variedades.length > 1 ? variedades.join(' · ') : p.variedad)}</div>
            <button type="button" class="card-close" id="cardClose" aria-label="Cerrar"><svg viewBox="0 0 18 18" width="13" height="13"><use href="#ic-cerrar"/></svg></button>
        </div>
        <div class="card-body">
            ${cuerpo}
            ${avisos.map(a => `<div class="card-alerta">${a}</div>`).join('')}
            <div class="card-hint">${fija ? 'Clic fuera para soltar' : 'Clic para fijar'}</div>
        </div>`;

    card.classList.toggle('fija', fija);
    card.classList.add('visible');
    if (fija) $('cardClose').onclick = desfijar;
    posicionarFicha(punto);
}

function posicionarFicha(punto) {
    const card = $('card'), r = card.getBoundingClientRect();
    const limite = panelAbierto() ? window.innerWidth - 392 : window.innerWidth;
    let x = punto.x + 16, y = punto.y + 14;
    if (x + r.width > limite - 12) x = punto.x - r.width - 16;
    if (y + r.height > window.innerHeight - 12) y = Math.max(12, window.innerHeight - r.height - 12);
    card.style.left = Math.max(12, x) + 'px';
    card.style.top = y + 'px';
}
const ocultarFicha = () => $('card').classList.remove('visible', 'fija');

/* ── Leyenda ────────────────────────────────────────────────────────────── */
function construirLeyenda() {
    // El árbol se arma de MODELOS_DE_VKEY, que ya incluye las ramas sin
    // polígono; contar sólo los cuarteles dibujados dejaría fuera justamente
    // las hectáreas que faltaban para cuadrar con el modelo.
    const porEspecie = {};
    Object.keys(MODELOS_DE_VKEY).forEach(k => {
        const [esp, variedad] = [k.slice(0, k.indexOf('|')), k.slice(k.indexOf('|') + 1)];
        const e = porEspecie[esp] || (porEspecie[esp] = { cuarteles: 0, variedades: {} });
        e.variedades[k] = { variedad, cuarteles: 0 };
    });
    GEO.cuarteles.features.forEach(f => {
        const p = f.properties, k = vkey(p.especie, p.variedad);
        const e = porEspecie[p.especie];
        if (!e) return;
        e.cuarteles++;
        if (e.variedades[k]) e.variedades[k].cuarteles++;
    });
    const orden = Object.keys(porEspecie).sort((a, b) => (HA_ESPECIE[b] || 0) - (HA_ESPECIE[a] || 0));

    $('legendBody').innerHTML = orden.map(esp => {
        const e = porEspecie[esp];
        const vars = Object.entries(e.variedades).sort((a, b) => (HA_VKEY[b[0]] || 0) - (HA_VKEY[a[0]] || 0));
        const filas = vars.map(([k, v]) => {
            const huerfana = SIN_POLIGONO.has(k);
            return `
            <div class="lg-row${huerfana ? ' sin-poligono' : ''}" data-vkey="${esc(k)}"${
                huerfana ? ' title="En el modelo pero sin polígono en el KMZ: suma en los totales y no se pinta"' : ''}>
                <i class="lg-dot" style="background:${COLOR_VARIEDAD[k]}"></i>
                <span class="lg-name">${esc(v.variedad)}</span>
                <span class="lg-meta">${HA_VKEY[k] ? nf(HA_VKEY[k], 1) + ' ha' : '—'}</span>
                <button type="button" class="lg-solo" title="Ver sólo esta variedad">solo</button>
            </div>`;
        }).join('');
        return `<div class="lg-esp abierta" data-especie="${esc(esp)}">
                    <div class="lg-row lg-esp-row">
                        <span class="lg-caret"><svg viewBox="0 0 18 18" width="11" height="11"><use href="#ic-caret"/></svg></span>
                        <i class="lg-dot" style="background:${COLOR_ESPECIE[esp]}"></i>
                        <span class="lg-name">${esc(esp)}</span>
                        <span class="lg-meta">${e.cuarteles} · ${HA_ESPECIE[esp] ? nf(HA_ESPECIE[esp], 1) + ' ha' : 's/m'}</span>
                        <button type="button" class="lg-solo" title="Ver sólo esta especie">solo</button>
                    </div>
                    <div class="lg-vars">${filas}</div>
                </div>`;
    }).join('');

    // Un clic en el nombre enciende o apaga; el caret sólo pliega la rama, y
    // «solo» aísla. Al pasar el cursor, los cuarteles de la rama se resaltan en
    // el mapa: es la única forma de saber dónde cae un nombre de la lista.
    const ramaDe = row => {
        const esp = row.closest('.lg-esp');
        return [...esp.querySelectorAll('.lg-vars .lg-row')].map(r => r.dataset.vkey);
    };
    $('legendBody').querySelectorAll('.lg-esp-row').forEach(row => {
        row.addEventListener('click', ev => {
            const esp = row.closest('.lg-esp');
            if (ev.target.closest('.lg-caret')) { esp.classList.toggle('abierta'); return; }
            const keys = ramaDe(row);
            if (ev.target.closest('.lg-solo')) return aislar(keys);
            const encender = keys.some(k => !visibles.has(k));
            keys.forEach(k => encender ? visibles.add(k) : visibles.delete(k));
            aplicarFiltro();
        });
        row.addEventListener('mouseenter', () => resaltar(ramaDe(row)));
    });
    $('legendBody').querySelectorAll('.lg-vars .lg-row').forEach(row => {
        row.addEventListener('click', ev => {
            const k = row.dataset.vkey;
            if (ev.target.closest('.lg-solo')) return aislar([k]);
            visibles.has(k) ? visibles.delete(k) : visibles.add(k);
            aplicarFiltro();
        });
        row.addEventListener('mouseenter', () => resaltar([row.dataset.vkey]));
    });
    // Un solo apagador al salir del panel: colgarlo de cada fila dejaba el
    // resalte prendido al pasar de una fila a la de al lado.
    $('legendBody').addEventListener('mouseleave', () => resaltar(null));

    actualizarSubLeyenda();
}

/* Los puntos siguen al modo: si el mapa está pintado por especie o por una
   escala continua, una leyenda con 26 colores de variedad prometería una
   distinción que el mapa no está haciendo. */
function pintarDots() {
    const porEscala = modo !== 'general';
    document.querySelectorAll('.lg-vars .lg-row').forEach(row => {
        const k = row.dataset.vkey;
        if (SIN_POLIGONO.has(k)) return;
        const color = porEscala ? css('--dat-sindato')
            : modoColor === 'especie' ? COLOR_ESPECIE[k.split('|')[0]] : COLOR_VARIEDAD[k];
        row.querySelector('.lg-dot').style.background = color;
        row.querySelector('.lg-dot').style.opacity = porEscala ? 0.35 : '';
    });
    document.querySelectorAll('.lg-esp-row .lg-dot').forEach(dot => {
        dot.style.opacity = porEscala ? 0.35 : '';
    });
}

function actualizarSubLeyenda() {
    const apagadas = Object.keys(MODELOS_DE_VKEY).length - visibles.size;
    const partes = [];
    // El filtro de rentabilidad primero: es el que explica un total que no es
    // el del predio, y se lee mejor con el número que con el nombre del signo.
    if (clavesRent) {
        const regs = clavesVisibles();
        const ha = regs.reduce((a, v) => a + v.ha, 0);
        partes.push(`<b class="lg-filtro">EBITDA ${filtroRent === 'pos' ? '+' : '−'}</b> ` +
            `en ${esc(MOD.temporadas[t])} · ` +
            regs.length + ' de ' + MOD.variedades.length + ' variedades · ' + nf(ha, 1) + ' ha');
    }
    if (apagadas) partes.push(`<b class="lg-filtro">${apagadas} ${apagadas === 1 ? 'rama apagada' : 'ramas apagadas'}</b>`);
    $('legendSub').innerHTML = partes.length
        ? partes.join(' · ') + ' · toca «Todo» para ver todo'
        : MOD.variedades.length + ' variedades · ' + nf(MOD.totales.ha, 2) + ' ha';
    $('btnTodo').classList.toggle('destacado', apagadas > 0 || !!clavesRent);
}

function pintarLeyenda() {
    document.querySelectorAll('.lg-vars .lg-row').forEach(row => {
        const k = row.dataset.vkey;
        const pasa = !clavesRent || (MODELOS_DE_VKEY[k] || []).some(m => clavesRent.has(m));
        row.classList.toggle('off', !visibles.has(k) || !pasa);
    });
    document.querySelectorAll('.lg-esp').forEach(esp => {
        const keys = [...esp.querySelectorAll('.lg-vars .lg-row')].map(r => r.dataset.vkey);
        esp.querySelector('.lg-esp-row').classList.toggle('off', !keys.some(k => visibles.has(k)));
    });
    actualizarSubLeyenda();
}

function pintarEscala() {
    const caja = $('escala');
    if (modo === 'general') {
        // En la Vista general no hay escala que mostrar, y la caja queda libre
        // para lo único que se dibuja además de los cuarteles: los pozos.
        const pz = pozosVisibles() ? GEO.pozos.features.map(f => f.properties) : [];
        caja.hidden = !pz.length;
        if (!pz.length) return;
        const enUso = pz.filter(p => p.en_uso).length;
        caja.innerHTML = `
            <div class="escala-tit">Pozos</div>
            <div class="escala-lista">
                <div class="escala-fila"><i class="pozo-dot en-uso"></i><span class="escala-nom">En uso</span><span class="escala-n">${enUso}</span></div>
                <div class="escala-fila"><i class="pozo-dot sin-uso"></i><span class="escala-nom">Seco, sin uso</span><span class="escala-n">${pz.length - enUso}</span></div>
            </div>`;
        return;
    }

    // El tipo de suelo no es una escala continua: es la simbología del plano,
    // categórica, y se lista con su descripción. Los colores son los del plano
    // original, no una paleta nuestra: el que conoce el papel reconoce el mapa.
    if (verFisico() && metricaSuelo === 'clase') {
        const usados = {};
        GEO.cuarteles.features.forEach(f => {
            const s = f.properties.suelo;
            if (s && cuartelVisible(f.properties))
                usados[s.clase] = (usados[s.clase] || 0) + 1;
        });
        caja.hidden = false;
        caja.innerHTML = `
            <div class="escala-tit">Tipos de suelo</div>
            <div class="escala-sub">Simbología del plano de la hacienda</div>
            <div class="escala-lista">${GEO.suelos.simbologia.filter(s => usados[s.clase]).map(s => `
                <div class="escala-fila" title="${esc(s.descripcion)}">
                    <i class="lg-dot" style="background:${s.color}"></i>
                    <span class="escala-nom">${esc(s.nombre)}</span>
                    <span class="escala-n">${usados[s.clase]}</span>
                </div>`).join('')}</div>`;
        return;
    }
    const e = escalaActiva();
    const ticks = e.cortes.map(c => e.fmt === pct ? pct(c)
        : e.fmt === usdkg ? nf(c, 2)
        : (Math.abs(c) >= 1000 ? Math.round(c / 1000) + 'k' : String(c)));
    caja.hidden = false;
    caja.innerHTML = `
        <div class="escala-tit">${esc(e.titulo)}</div>
        <div class="escala-sub">${esc(e.unidad)}${e.tipo === 'terreno'
            ? ' · DEM ' + esc(GEO.terreno.fuente)
            : e.tipo === 'suelo' ? ' · plano de la hacienda'
            : ' · ' + esc(temporadaActual()) + (verCosecha() ? ' · cosechado'
                : conEscenario() ? ' · ' + esc(etiquetaEscenario()) : '')}</div>
        <div class="escala-barra">${e.tokens.map(tk => `<i style="background:${css(tk)}"></i>`).join('')}</div>
        <div class="escala-ticks">${ticks.map(x => `<span>${esc(x)}</span>`).join('')}</div>
        <div class="escala-nd"><i style="background:${css('--dat-sindato')}"></i>Sin contraparte en el modelo</div>`;
}

/* Deja pasar sólo las variedades del signo pedido. Las que no tienen EBITDA
   —lo que el KMZ agrupa como Disponible, sin contraparte en el modelo— quedan
   fuera de las dos listas: no es que ganen o pierdan, es que no hay número.

   Se encienden además todas las ramas: es una acción de «muéstrame esto», como
   Todo y Nada, y dejarla debajo de un filtro de leyenda anterior daría un
   número más chico que el de la tabla sin decir por qué. */
function aplicarRentabilidad(signo) {
    filtroRent = signo;
    clavesRent = null;
    if (signo) {
        clavesRent = new Set();
        MOD.variedades.forEach(v => {
            const eb = v.ebitda_ha[t];
            if (eb == null) return;
            if (signo === 'pos' ? eb > 0 : eb <= 0) clavesRent.add(vkey(v.especie, v.variedad));
        });
        Object.keys(MODELOS_DE_VKEY).forEach(k => visibles.add(k));
    }
    aplicarFiltro();
}

/* Los cinco cuarteles que llevan variedades de los dos signos. El paño es uno
   solo y no se puede partir, así que aparece —tiene una variedad que gana— y
   se pinta con su valor recompuesto, que puede salir rojo. La ficha lo dice. */
const mezclaSignos = p => !!clavesRent && (() => {
    const ms = arr(p.modelo).filter(k => MIDX[k]);
    return ms.some(k => clavesRent.has(k)) && ms.some(k => !clavesRent.has(k));
})();

/* Qué botón va encendido. Sale del estado y no de la última pulsación: si el
   usuario toca una fila de la leyenda, la selección deja de ser «las
   positivas» y ningún botón debe decir que lo es. */
function sincronizarRentabilidad() {
    document.querySelectorAll('#segRent button').forEach(b =>
        b.classList.toggle('activo', b.dataset.rent === (filtroRent || '')));
    // La temporada va en el tooltip porque el filtro siempre mira el EBITDA del
    // MODELO: en Producción ▸ Cosechada el selector de arriba muestra temporadas
    // cosechadas, que son otro eje de tiempo, y sin decirlo el filtro parecería
    // referirse a esas.
    const cuando = MOD ? ' en ' + MOD.temporadas[t] : '';
    $('btnRentPos').title = 'Sólo las variedades con EBITDA/ha positivo' + cuando;
    $('btnRentNeg').title = 'Sólo las variedades con EBITDA/ha cero o negativo' + cuando;
}

/* Aislar una rama: la deja sola encendida y, si ya estaba sola, devuelve todas.
   Apagar treinta y dos variedades a mano para poder mirar una es el camino
   largo del mismo viaje, y volver de ahí era peor todavía. */
function aislar(claves) {
    const solo = claves.length === visibles.size && claves.every(k => visibles.has(k));
    visibles.clear();
    if (solo) Object.keys(MODELOS_DE_VKEY).forEach(k => visibles.add(k));
    else claves.forEach(k => visibles.add(k));
    aplicarFiltro();
}

/* Dónde está lo que dice esta fila de la leyenda. Con 174 polígonos y nombres
   que se repiten entre especies, leer «Santina» y no saber a qué parte del
   cerro apunta es el hueco más grande que tenía la leyenda. */
function resaltar(claves) {
    if (!map.getLayer('cuarteles-resalte')) return;
    map.setFilter('cuarteles-resalte', claves && claves.length
        ? ['match', ['concat', ['get', 'especie'], '|', ['get', 'variedad']], claves, true, false]
        : ['boolean', false]);
}

/* ¿Se ve este cuartel? Dos tamices: la rama tiene que estar encendida en la
   leyenda y, si hay filtro de rentabilidad, el paño tiene que llevar al menos
   una variedad que lo pase. Un cuartel mixto con una variedad de cada signo
   aparece: tiene algo que mostrar. */
const cuartelVisible = p => visibles.has(vkey(p.especie, p.variedad)) &&
    (!clavesRent || arr(p.modelo).some(k => clavesRent.has(k)));

/* El filtro es la única puerta: capas, métricas, leyenda y panel leen el mismo set. */
function aplicarFiltro() {
    // Antes que nada: cambiar qué ramas están encendidas puede cambiar la
    // unidad en que habla toda la pestaña.
    actualizarUnidad();
    sincronizarRentabilidad();
    const f = exprFiltro();
    ['cuarteles-fill', 'cuarteles-line', 'cuarteles-label'].forEach(id => {
        if (map.getLayer(id)) map.setFilter(id, f);
    });
    if (fijado) {
        const p = GEO.cuarteles.features.find(x => x.properties.uid === fijado);
        if (p && !cuartelVisible(p.properties)) desfijar();
    }
    // La escala también: depende del filtro por dos vías. La leyenda de tipos de
    // suelo cuenta los cuarteles encendidos, y en Producción la unidad -kilos o
    // cajas- sale de qué ramas quedaron a la vista.
    pintarLeyenda(); pintarEscala(); pintarMetricas(); pintarPanel();
}

function repintar() {
    actualizarUnidad();
    if (map.getLayer('cuarteles-fill')) map.setPaintProperty('cuarteles-fill', 'fill-color', exprColor());
    pintarDots(); pintarEscala(); pintarMetricas(); pintarPanel();
}

/* ── Métricas ───────────────────────────────────────────────────────────── */
/* Se leen las ramas encendidas, no los polígonos dibujados: así las dos
   variedades que el modelo tiene y el KMZ no dibuja siguen sumando. */
const idsVisibles = () => {
    const s = new Set();
    visibles.forEach(k => (MODELOS_DE_VKEY[k] || []).forEach(m => {
        if (!clavesRent || clavesRent.has(m)) s.add(m);
    }));
    return [...s];
};
const clavesVisibles = () => idsVisibles().map(k => MIDX[k]).filter(Boolean);

/* El mismo índice, pero de otro escenario: es lo que permite sumar la misma
   selección de ramas en los dos y compararlas sin cambiar de escenario. */
const IDX_ESC = {};
function idxDe(id) {
    if (!IDX_ESC[id] && ESC[id]) {
        IDX_ESC[id] = {};
        ESC[id].variedades.forEach(v => { IDX_ESC[id][vkey(v.especie, v.variedad)] = v; });
    }
    return IDX_ESC[id] || {};
}
const regsDe = (id, claves) => claves.map(k => idxDe(id)[k]).filter(Boolean);

function agregado(regs, temporada) {
    const ha = regs.reduce((a, v) => a + v.ha, 0);
    const suma = campo => regs.reduce((a, v) => a + (v[campo][temporada] || 0), 0);
    const ingresos = suma('ingresos'), costos = suma('costos'), ebitda = suma('ebitda');
    // Los kilos vienen ya convertidos desde el modelo: sumar la producción
    // cruda mezclaría cajas de uva de mesa con kilos de cereza en un total que
    // no sería ni cajas ni kilos.
    const kg = suma('kg');
    return {
        ha, kg, ingresos, costos, ebitda,
        ebitda_ha: ha ? ebitda / ha : null,
        margen: ingresos ? ebitda / ingresos : null,
        ingreso_kg: kg ? ingresos / kg : null,
        costo_kg: kg ? costos / kg : null,
        ebitda_kg: kg ? ebitda / kg : null
    };
}

function pintarMetricas() {
    // Se vuelve a medir al final: el ancho de la barra depende de lo que diga,
    // y lo que dice cambia con el modo, con la métrica y con el filtro.
    try { return pintarMetricasBarra(); } finally { acomodarChrome(); }
}

function pintarMetricasBarra() {
    const regs = clavesVisibles(), a = agregado(regs, t);
    const cuarteles = GEO.cuarteles.features.filter(f => cuartelVisible(f.properties)).length;
    const plural = (n, s, p) => n === 1 ? s : p;
    // Con el árbol filtrado, el titular no es la superficie del predio. En vez
    // de mostrar un número suelto que obliga a preguntarse de dónde salió, la
    // etiqueta dice contra qué se está comparando.
    const filtrado = a.ha > 0 && a.ha < MOD.totales.ha - 0.005;
    const etiquetaHa = filtrado
        ? `de ${nf(MOD.totales.ha, 1)} ha · ${Math.round(a.ha / MOD.totales.ha * 100)}%`
        : 'Hectáreas';

    if (modo === 'general') {
        $('statsBar').innerHTML = `
            <div class="stat"><span class="stat-val">${nf(a.ha, 1)}</span><span class="stat-lbl">${etiquetaHa}</span></div>
            <div class="stat"><span class="stat-val">${cuarteles}</span><span class="stat-lbl">${plural(cuarteles, 'Cuartel', 'Cuarteles')}</span></div>
            <div class="stat"><span class="stat-val">${regs.length}</span><span class="stat-lbl">${plural(regs.length, 'Variedad', 'Variedades')}</span></div>`;
        return;
    }
    if (verFisico()) {
        const conSuelo = GEO.cuarteles.features.map(f => f.properties)
            .filter(p => cuartelVisible(p) && p.suelo);
        const tipos = new Set(conSuelo.map(p => p.suelo.clase));
        const prof = conSuelo.length ? conSuelo.reduce((a, p) => a + p.suelo.prof_cm, 0) / conSuelo.length : null;
        const someros = conSuelo.filter(p => p.suelo.prof_cm <= 25).length;
        $('statsBar').innerHTML = `
            <div class="stat"><span class="stat-val">${tipos.size}</span><span class="stat-lbl">${plural(tipos.size, 'Tipo de suelo', 'Tipos de suelo')}</span></div>
            <div class="stat"><span class="stat-val">${nf(prof, 0)}</span><span class="stat-lbl">cm 1er horizonte</span></div>
            <div class="stat"><span class="stat-val">${someros}</span><span class="stat-lbl">Cuarteles ≤ 25 cm</span></div>
            <div class="stat"><span class="stat-val">${conSuelo.length}</span><span class="stat-lbl">${plural(conSuelo.length, 'Cuartel', 'Cuarteles')}</span></div>`;
        return;
    }
    if (verTerreno()) {
        // El terreno se resume sobre los cuarteles dibujados, no sobre las
        // variedades: aquí la unidad es el polígono, y la pendiente se pondera
        // por superficie del modelo para que un paño de 0,4 ha no pese igual
        // que uno de 38.
        const conDem = GEO.cuarteles.features.map(f => f.properties)
            .filter(p => cuartelVisible(p) && p.pendiente != null);
        const peso = p => (p.modelo || []).reduce((a, k) => a + ((MIDX[k] || {}).ha || 0), 0) || 0.1;
        const wt = conDem.reduce((a, p) => a + peso(p), 0);
        const pend = wt ? conDem.reduce((a, p) => a + p.pendiente * peso(p), 0) / wt : null;
        const empinados = conDem.filter(p => p.pendiente >= 15).length;
        const rango = conDem.length
            ? miles(Math.min(...conDem.map(p => p.elev_min))) + '–' + miles(Math.max(...conDem.map(p => p.elev_max)))
            : '—';
        $('statsBar').innerHTML = `
            <div class="stat"><span class="stat-val">${nf(pend, 1)}</span><span class="stat-lbl">% pendiente media</span></div>
            <div class="stat"><span class="stat-val">${rango}</span><span class="stat-lbl">Elevación m</span></div>
            <div class="stat"><span class="stat-val">${empinados}</span><span class="stat-lbl">Cuarteles ≥ 15%</span></div>
            <div class="stat"><span class="stat-val">${conDem.length}</span><span class="stat-lbl">${plural(conDem.length, 'Cuartel', 'Cuarteles')}</span></div>`;
        return;
    }
    if (verCosecha()) {
        // Las hectáreas del denominador son las que tenían cosecha registrada
        // esa temporada, no las 292 del predio: en 2023-2024 buena parte del
        // campo todavía no entraba en producción, y dividir por el total daría
        // un rendimiento que no es el de ningún cuartel.
        const c = regsConCosecha(regs, tc);
        const kg = c.reduce((x, v) => x + v.cosecha.kg[tc], 0);
        const ha = c.reduce((x, v) => x + v.ha, 0);
        // Contra qué se compara: lo que el modelo pide en plena producción.
        const plena = agregado(regs, UTILES - 1);
        const meta = plena.ha ? plena.kg / plena.ha : null;
        const real = ha ? kg / ha : null;
        $('statsBar').innerHTML = `
            <div class="stat"><span class="stat-val">${nf(ha, 1)}</span><span class="stat-lbl">ha cosechadas</span></div>
            <div class="stat"><span class="stat-val">${nf(kg / 1000, 0)}</span><span class="stat-lbl">Toneladas</span></div>
            <div class="stat"><span class="stat-val">${miles(enUnidad(real, UNIDAD.factor))}</span><span class="stat-lbl">${UNIDAD.larga}</span></div>
            <div class="stat"><span class="stat-val">${miles(enUnidad(meta, UNIDAD.factor))}</span><span class="stat-lbl">${UNIDAD.larga} en plena prod.</span></div>
            <div class="stat"><span class="stat-val${real && meta && real < meta ? ' neg' : ''}">${
                real && meta ? pct(real / meta) : '—'}</span><span class="stat-lbl">de la plena prod.</span></div>`;
        return;
    }
    if (modo === 'produccion') {
        $('statsBar').innerHTML = `
            <div class="stat"><span class="stat-val">${nf(a.ha, 1)}</span><span class="stat-lbl">${etiquetaHa}</span></div>
            <div class="stat"><span class="stat-val">${nf(a.kg / 1000, 0)}</span><span class="stat-lbl">Toneladas</span></div>
            <div class="stat"><span class="stat-val">${miles(a.ha ? enUnidad(a.kg / a.ha, UNIDAD.factor) : null)}</span><span class="stat-lbl">${UNIDAD.larga}</span></div>
            <div class="stat"><span class="stat-val">${regs.length}</span><span class="stat-lbl">${plural(regs.length, 'Variedad', 'Variedades')}</span></div>`;
        return;
    }
    // La barra habla en la unidad elegida. Las dos familias comparten el ancla
    // -la superficie encendida y el EBITDA absoluto- y cambian las cuatro del
    // medio: apilar US$/ha y US$/kg en la misma línea obliga a mirar la etiqueta
    // de cada número antes de poder comparar dos, y entonces ya no es un titular.
    const dec2 = x => x == null ? '—' : (x < 0 ? '−' : '') + Math.abs(x).toFixed(2).replace('.', ',');
    const medio = porKilo()
        ? `<div class="stat"><span class="stat-val">${nf(a.kg / 1000, 0)}</span><span class="stat-lbl">Toneladas</span></div>
           <div class="stat"><span class="stat-val">${dec2(a.ingreso_kg)}</span><span class="stat-lbl">Ingreso US$/kg</span></div>
           <div class="stat"><span class="stat-val">${dec2(a.costo_kg)}</span><span class="stat-lbl">Costo US$/kg</span></div>
           <div class="stat"><span class="stat-val${a.ebitda_kg < 0 ? ' neg' : ''}">${dec2(a.ebitda_kg)}</span><span class="stat-lbl">Margen US$/kg</span></div>`
        : `<div class="stat"><span class="stat-val">${miles(a.ingresos)}</span><span class="stat-lbl">Ingresos US$</span></div>
           <div class="stat"><span class="stat-val">${miles(a.costos)}</span><span class="stat-lbl">Costos US$</span></div>
           <div class="stat"><span class="stat-val${a.ebitda_ha < 0 ? ' neg' : ''}">${miles(a.ebitda_ha)}</span><span class="stat-lbl">EBITDA/ha</span></div>
           <div class="stat"><span class="stat-val${a.margen < 0 ? ' neg' : ''}">${pct(a.margen)}</span><span class="stat-lbl">Margen s/ventas</span></div>`;
    $('statsBar').innerHTML = `
        <div class="stat"><span class="stat-val">${nf(a.ha, 1)}</span><span class="stat-lbl">${etiquetaHa}</span></div>
        ${medio}
        <div class="stat"><span class="stat-val${a.ebitda < 0 ? ' neg' : ''}">${miles(a.ebitda)}</span><span class="stat-lbl">EBITDA US$</span></div>`;
}

/* ── Panel del modelo ───────────────────────────────────────────────────── */
/* ═══ Panel lateral ════════════════════════════════════════════════════════
   El panel acompaña a los cinco modos y muestra lo del modo: antes existía
   sólo en Producción y Financiero, y en los otros tres quedaba una franja
   muerta a la derecha del mapa. Cada modo trae su gráfico y su tabla. */

const TITULO_PANEL = {
    general: 'Composición del predio', produccion: 'Producción', financiero: 'Financiero'
};
const tituloPanel = () => modo === 'suelos'
    ? (subSuelo === 'terreno' ? 'Terreno' : 'Tipo de suelo')
    : verCosecha() ? 'Cosecha real'
    : (TITULO_PANEL[modo] || 'Datos');

/* Los cuarteles dibujados de las ramas encendidas. Terreno y suelo se miden
   por cuartel -el DEM y el plano clasifican polígonos, no variedades-, así que
   sus repartos se cuentan en cuarteles y no en hectáreas: repartir las ha de
   una variedad entre sus cuarteles exigiría un supuesto que nadie pidió. */
const cuartelesVisibles = () => GEO.cuarteles.features
    .map(f => f.properties)
    .filter(p => cuartelVisible(p));

/* Agregado por especie del KMZ, con las hectáreas del modelo. */
function porEspecieVisible() {
    const out = {};
    const nuevo = esp => out[esp] || (out[esp] = {
        especie: esp, cuarteles: 0, claves: new Set(), pend: [], elev: [], prof: []
    });
    // Las hectáreas salen de las ramas encendidas, incluidas las que el modelo
    // tiene y el KMZ no dibuja. Contarlas desde los polígonos dejaba fuera esas
    // 3,4 ha y la tabla sumaba 280,62 mientras la barra decía 284,02.
    visibles.forEach(k => (MODELOS_DE_VKEY[k] || []).forEach(m =>
        nuevo(k.slice(0, k.indexOf('|'))).claves.add(m)));
    // Los cuarteles, la pendiente y el suelo sí son del polígono: son lo que se
    // midió sobre el terreno dibujado.
    cuartelesVisibles().forEach(p => {
        const e = nuevo(p.especie);
        e.cuarteles++;
        if (p.pendiente != null) { e.pend.push(p.pendiente); e.elev.push(p.elev); }
        const su = obj(p.suelo);
        if (su) e.prof.push(su.prof_cm);
    });
    const media = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
    return Object.values(out).map(e => ({
        ...e,
        ha: [...e.claves].reduce((a, k) => a + ((MIDX[k] || {}).ha || 0), 0),
        pendiente: media(e.pend), elevacion: media(e.elev), profundidad: media(e.prof)
    })).sort((a, b) => b.ha - a.ha);
}

function pintarPanel() {
    if (!panelAbierto()) return;
    const regs = clavesVisibles();
    $('mpTitulo').textContent = tituloPanel();
    // Sólo la temporada, y sólo donde la hay: las hectáreas encendidas ya están
    // en la barra de métricas.
    // El nombre del escenario va pegado a la temporada: son los dos ejes que
    // definen de qué números habla el panel, y sin él dos capturas de pantalla
    // del mismo predio serían indistinguibles.
    $('mpSub').textContent = (modo === 'produccion' || modo === 'financiero')
        ? temporadaActual() + (conEscenario() ? ' · ' + etiquetaEscenario() : '')
        : GEO.farm.name;
    // Las dos vistas de gráfico son de Producción y Financiero; en los demás
    // modos hay una sola cosa que mostrar.
    $('mpChartTabs').hidden = !(modo === 'produccion' || modo === 'financiero');
    // En Vista general y en Terreno la tabla es por especie, y en Tipo de suelo
    // por tipo: el encabezado decía «Tabla por variedad» sobre una tabla cuya
    // primera columna era «Especie».
    $('tituloTabla').textContent = verFisico() ? 'Tabla por tipo de suelo'
        : (modo === 'general' || verTerreno()) ? 'Tabla por especie'
        : verCosecha() ? 'Cosecha por variedad' : 'Tabla por variedad';
    dibujarGrafico(regs);
    pintarTabla(regs);
    pintarEscenarios();
    pintarConciliacion();
}

/* ── Tabla ───────────────────────────────────────────────────────────────── */
function pintarTabla(regs) {
    if (modo === 'general' || verTerreno()) return tablaEspecies();
    if (verFisico()) return tablaSuelos();
    if (verCosecha()) return tablaCosecha(regs);
    return tablaVariedades(regs);
}

/* Las tres temporadas cosechadas, una al lado de la otra, más lo que el modelo
   pide en plena producción. Puestas en fila se lee de un vistazo qué variedad
   viene subiendo, cuál tuvo un año malo y cuál está lejos de lo que el modelo
   le exige, que es la pregunta que abre esta pestaña. */
function tablaCosecha(regs) {
    const cols = [{ k: 'variedad', t: 'Variedad' },
                  { k: 'c0', t: '23/24' }, { k: 'c1', t: '24/25' }, { k: 'c2', t: '25/26' },
                  { k: 'avance', t: '% plena' }];
    if (!cols.some(c => c.k === ordenTabla.campo)) ordenTabla = { campo: 'c' + tc, asc: false };

    const datos = regs.filter(v => v.cosecha).map(v => {
        const meta = v.rend_kg_ha[UTILES - 1];
        const fila = { variedad: v.variedad, especie: v.especie, ha: v.ha, reg: v, meta,
                       factor: v.kg_por_unidad || 1, agrupada: !!v.cosecha.agrupada };
        // Se guarda en kilos -por eso el orden sigue siendo físico- y se muestra
        // en la unidad de la variedad.
        v.cosecha.rend_kg_ha.forEach((x, i) => { fila['c' + i] = x; });
        fila.avance = meta && fila['c' + tc] != null ? fila['c' + tc] / meta : null;
        return fila;
    });
    const filas = ordenarPor(datos, ordenTabla.campo, ordenTabla.campo === 'variedad').map(f => {
        const color = COLOR_VARIEDAD[VKEY_DE_MODELO[vkey(f.especie, f.variedad)]] || css('--dat-sindato');
        const celda = k => k === 'avance' ? (f.avance == null ? '—' : pct(f.avance))
            : f[k] == null ? '—' : miles(enUnidad(f[k], f.factor));
        const tag = f.factor > 1 ? `<span class="u-tag" title="Cajas de 8,2 kg">cj</span>` : '';
        return `<tr data-variedad="${esc(vkey(f.especie, f.variedad))}"${
            f.agrupada ? ' title="Fuente 2 la mide junto con otra variedad; el total se reparte con el detalle de la Ficha"' : ''}>
            <td><i class="lg-dot" style="background:${color}"></i>${esc(f.variedad)}${f.agrupada ? ' *' : ''}${tag}</td>
            ${['c0', 'c1', 'c2'].map(k => `<td class="${k === 'c' + tc ? 'col-activa' : ''}">${celda(k)}</td>`).join('')}
            <td class="${f.avance != null && f.avance < 1 ? 'neg' : ''}">${celda('avance')}</td>
        </tr>`;
    }).join('');
    filaTabla(cols, () => tablaCosecha(clavesVisibles()), filas);
    $('tabla').querySelectorAll('tbody tr').forEach(tr =>
        tr.addEventListener('click', () => volarAVariedad(tr.dataset.variedad)));
}

function filaTabla(cols, ordenar, filas) {
    $('tabla').innerHTML = `
        <thead><tr>${cols.map(c => `<th data-k="${c.k}" class="${
            ordenTabla.campo === c.k ? 'orden' + (ordenTabla.asc ? ' asc' : '') : ''}">${c.t}</th>`).join('')}</tr></thead>
        <tbody>${filas}</tbody>`;
    $('tabla').querySelectorAll('th').forEach(th => th.addEventListener('click', () => {
        const k = th.dataset.k;
        ordenTabla = { campo: k, asc: ordenTabla.campo === k ? !ordenTabla.asc : k === 'variedad' || k === 'especie' };
        ordenar();
    }));
}

function ordenarPor(lista, campo, texto) {
    return [...lista].sort((x, y) => {
        const a = x[campo], b = y[campo];
        const cmp = texto ? String(a).localeCompare(String(b), 'es') : (a || 0) - (b || 0);
        return ordenTabla.asc ? cmp : -cmp;
    });
}

function tablaEspecies() {
    const terreno = verTerreno();
    const cols = terreno
        ? [{ k: 'especie', t: 'Especie' }, { k: 'ha', t: 'ha' },
           { k: 'pendiente', t: 'Pendiente' }, { k: 'elevacion', t: 'Elev. m' }]
        : [{ k: 'especie', t: 'Especie' }, { k: 'cuarteles', t: 'Cuarteles' },
           { k: 'ha', t: 'ha' }, { k: 'pct', t: '% predio' }];
    if (!cols.some(c => c.k === ordenTabla.campo)) ordenTabla = { campo: 'ha', asc: false };

    const datos = porEspecieVisible();
    const total = datos.reduce((a, e) => a + e.ha, 0);
    datos.forEach(e => { e.pct = total ? e.ha / total : 0; });
    const filas = ordenarPor(datos, ordenTabla.campo, ordenTabla.campo === 'especie').map(e => `
        <tr>
            <td><i class="lg-dot" style="background:${COLOR_ESPECIE[e.especie] || css('--dat-sindato')}"></i>${esc(e.especie)}</td>
            ${terreno
                ? `<td>${nf(e.ha, 1)}</td><td>${nf(e.pendiente, 1)}%</td><td>${miles(e.elevacion)}</td>`
                : `<td>${e.cuarteles}</td><td>${nf(e.ha, 1)}</td><td>${pct(e.pct)}</td>`}
        </tr>`).join('');
    filaTabla(cols, tablaEspecies, filas);
}

function tablaSuelos() {
    const cols = [{ k: 'nombre', t: 'Tipo de suelo' }, { k: 'cuarteles', t: 'Cuarteles' },
                  { k: 'prof_cm', t: '1er horiz.' }];
    if (!cols.some(c => c.k === ordenTabla.campo)) ordenTabla = { campo: 'cuarteles', asc: false };

    const cuenta = {};
    cuartelesVisibles().forEach(p => {
        const su = obj(p.suelo);
        if (su) cuenta[su.clase] = (cuenta[su.clase] || 0) + 1;
    });
    const datos = GEO.suelos.simbologia.filter(s => cuenta[s.clase])
        .map(s => ({ ...s, cuarteles: cuenta[s.clase] }));
    const filas = ordenarPor(datos, ordenTabla.campo, ordenTabla.campo === 'nombre').map(s => `
        <tr title="${esc(s.descripcion)}">
            <td><i class="lg-dot" style="background:${s.color}"></i>${esc(s.nombre)}</td>
            <td>${s.cuarteles}</td><td>${s.prof_cm}</td>
        </tr>`).join('');
    filaTabla(cols, tablaSuelos, filas);
}

/* Las columnas son las del modo: en Producción no tiene nada que hacer una
   columna de margen, y en Financiero una de kg/ha compite con lo que el
   usuario vino a mirar. */
function tablaVariedades(regs) {
    const cols = modo === 'produccion'
        ? [{ k: 'variedad', t: 'Variedad' }, { k: 'ha', t: 'ha' },
           { k: 'rend_kg_ha', t: 'Rend./ha' }, { k: 'kg', t: 'Ton' }]
        : porKilo()
        ? [{ k: 'variedad', t: 'Variedad' }, { k: 'ha', t: 'ha' },
           { k: 'ingreso_kg', t: 'Ing/kg' }, { k: 'costo_kg', t: 'Costo/kg' },
           { k: 'ebitda_kg', t: 'Margen/kg' }]
        : [{ k: 'variedad', t: 'Variedad' }, { k: 'ha', t: 'ha' },
           { k: 'costo_ha', t: 'Costo/ha' }, { k: 'ebitda_ha', t: 'EBITDA/ha' },
           { k: 'margen', t: 'Margen' }];
    if (!cols.some(c => c.k === ordenTabla.campo)) {
        ordenTabla = { campo: modo === 'produccion' ? 'rend_kg_ha' : (porKilo() ? 'ebitda_kg' : 'ebitda_ha'), asc: false };
    }
    const valor = (v, k) => k === 'variedad' ? v.variedad : (Array.isArray(v[k]) ? v[k][t] : v[k]);
    const celda = (v, k) => {
        if (k === 'variedad') return esc(v.variedad);
        if (k === 'ha') return nf(v.ha, 1);
        if (k === 'margen') return pct(v.margen[t]);
        if (k === 'kg') return miles((v.kg[t] || 0) / 1000);
        // El rendimiento, en la unidad de SU variedad. Se ordena por el
        // equivalente en kilos para que el ranking siga siendo físico: si se
        // ordenara por el número mostrado, 4.645 cajas quedarían sobre 13.825
        // kilos sin que eso signifique nada.
        if (k === 'rend_kg_ha') return miles(enUnidad(v.rend_kg_ha[t], v.kg_por_unidad || 1));
        // Dos decimales y sin el «US$ /kg» de la unidad: la columna ya lo dice
        // en el encabezado y repetirlo en 33 filas no agrega nada.
        if (POR_KILO.has(k)) return v[k][t] == null ? '—' : nf(v[k][t], 2);
        return miles(v[k][t]);
    };
    const filas = [...regs].sort((x, y) => {
        const a = valor(x, ordenTabla.campo), b = valor(y, ordenTabla.campo);
        const cmp = typeof a === 'string' ? a.localeCompare(b, 'es') : (a || 0) - (b || 0);
        return ordenTabla.asc ? cmp : -cmp;
    }).map(v => {
        const clave = vkey(v.especie, v.variedad);
        const color = COLOR_VARIEDAD[VKEY_DE_MODELO[clave]] || css('--dat-sindato');
        const f = v.kg_por_unidad || 1;
        const tag = modo === 'produccion' && f > 1
            ? `<span class="u-tag" title="Cajas de 8,2 kg">cj</span>` : '';
        return `<tr data-variedad="${esc(clave)}">${cols.map((c, i) => {
            const neg = (c.k === 'ebitda_ha' || c.k === 'margen' || c.k === 'ebitda_kg') && valor(v, c.k) < 0;
            return i === 0
                ? `<td><i class="lg-dot" style="background:${color}"></i>${celda(v, c.k)}${tag}</td>`
                : `<td class="${neg ? 'neg' : ''}">${celda(v, c.k)}</td>`;
        }).join('')}</tr>`;
    }).join('');
    filaTabla(cols, () => tablaVariedades(clavesVisibles()), filas);
    $('tabla').querySelectorAll('tbody tr').forEach(tr =>
        tr.addEventListener('click', () => volarAVariedad(tr.dataset.variedad)));
}

/* Los dos escenarios sobre la MISMA selección de ramas y la MISMA temporada.
   Es la pregunta que justifica tener dos modelos: no «cuánto da el pesimista»
   sino «cuánto menos da», y sobre lo que se está mirando, no sobre el predio
   entero. Cambiar de escenario para anotar un número y volver a cambiar es la
   forma lenta de leer esta tabla. */
function pintarEscenarios() {
    const caja = $('sectEscenarios');
    if (!conEscenario()) { caja.hidden = true; return; }
    caja.hidden = false;

    const claves = idsVisibles();
    const cols = ESCENARIOS.map(e => ({ ...e, a: agregado(regsDe(e.id, claves), t) }));
    const act = cols.findIndex(c => c.id === escenario);
    const ref = cols[0].a, otro = cols[cols.length - 1].a;

    // La variación de una razón se dice en puntos, no en porcentaje: un margen
    // que baja de 8,9% a 6,0% no bajó «un 33%», bajó 2,9 puntos.
    const filas = [
        { t: 'Producción', v: c => nf(c.kg / 1000, 0) + ' t', d: () => rel(otro.kg, ref.kg) },
        { t: 'Ingresos', v: c => usd(c.ingresos), d: () => rel(otro.ingresos, ref.ingresos) },
        { t: 'Costos', v: c => usd(c.costos), d: () => rel(otro.costos, ref.costos) },
        { t: 'EBITDA', v: c => usd(c.ebitda), d: () => rel(otro.ebitda, ref.ebitda) },
        { t: 'EBITDA / ha', v: c => usd(c.ebitda_ha), d: () => rel(otro.ebitda_ha, ref.ebitda_ha) },
        { t: 'Margen s/ventas', v: c => pct(c.margen), d: () => puntos(otro.margen, ref.margen) },
        { t: 'Margen / kg', v: c => usdkg(c.ebitda_kg), d: () => rel(otro.ebitda_kg, ref.ebitda_kg) }
    ];
    $('tablaEsc').innerHTML = `
        <thead><tr><th></th>${cols.map((c, i) =>
            `<th class="${i === act ? 'activa' : ''}" title="${esc(c.nota || '')}">${esc(c.nombre)}</th>`).join('')}
            <th>Δ</th></tr></thead>
        <tbody>${filas.map(f => {
            const d = f.d();
            return `<tr><td>${f.t}</td>${cols.map((c, i) =>
                `<td class="${i === act ? 'activa' : ''}">${f.v(c.a)}</td>`).join('')}
                <td class="delta ${d.signo}">${d.texto}</td></tr>`;
        }).join('')}</tbody>`;

    const filtrado = claves.length < MOD.variedades.length;
    // Con nombres de una cifra, la nota de cada escenario es lo unico que dice
    // cual es cual, asi que encabeza el pie de la tabla.
    $('escNota').textContent = ESCENARIOS.map(e => e.nombre + ': ' + (e.nota || '').replace(/\.\s*$/, '')).join(' · ') +
        '. Los dos sobre ' +
        (filtrado ? 'las ' + claves.length + ' variedades encendidas' : 'el predio completo') +
        ', en ' + MOD.temporadas[t] + '. Cada escenario es un libro propio, con sus supuestos: ' +
        'no es un descuento aplicado sobre el otro.';
}

/* Variación relativa, cuidando el caso que rompe el porcentaje: cuando la
   referencia es cero o cambia de signo, «−340%» no significa nada. */
function rel(x, base) {
    if (x == null || base == null) return { texto: '—', signo: '' };
    if (!base || (base < 0) !== (x < 0)) return { texto: usd(x - base), signo: x < base ? 'baja' : 'sube' };
    const r = x / base - 1;
    return { texto: (r > 0 ? '+' : '') + nf(r * 100, 1) + '%', signo: r < 0 ? 'baja' : r > 0 ? 'sube' : '' };
}
function puntos(x, base) {
    if (x == null || base == null) return { texto: '—', signo: '' };
    const d = (x - base) * 100;
    return { texto: (d > 0 ? '+' : '') + nf(d, 1) + ' pp', signo: d < 0 ? 'baja' : d > 0 ? 'sube' : '' };
}

function pintarConciliacion() {
    const c = MOD.conciliacion_superficie;
    $('conc').innerHTML = c.map((r, i) => {
        const clase = r.ha < 0 ? 'resta' : (i === c.length - 1 ? 'total' : '');
        return `<tr class="${clase}"><td>${esc(r.concepto)}<br><span style="color:var(--sem-text-3);font-size:9.5px">${esc(r.nota)}</span></td><td>${nf(r.ha, 2)} ha</td></tr>`;
    }).join('');
    $('concNota').innerHTML = 'Las 284,02 ha son la base de todo el modelo. Ningún cálculo del mapa usa la superficie del polígono del KMZ —la ficha la muestra, rotulada, sólo para que se vea cuánto mide el paño que se está tocando—: ' +
        'un contorno dibujado no es una medición, y mezclarlo con la tasación descuadraría los totales.';

    const av = MOD.avisos, partes = [];
    const cos = av.cosecha || {};

    if (av.arrendados && av.arrendados.length) {
        partes.push('<div class="mp-aviso"><b>Cuarteles arrendados, fuera del análisis.</b> ' +
            av.arrendados.map(esc).join(' y ') + ' están arrendados a terceros. El modelo dejó de contar su ' +
            'superficie —de 292,23 a 284,02 ha— y en el mapa van en gris, en su propia rama <i>Arrendado</i>, ' +
            'sin entrar en ningún total ni en el filtro de EBITDA.</div>');
    }

    // El más caro primero: una celda mal puesta que infla una temporada entera.
    if (cos.rend_es_total && cos.rend_es_total.length) {
        const exceso = cos.rend_es_total.reduce((a, m) => a + ((m.ingreso_modelado || 0) - (m.ingreso_implicado || 0)), 0);
        partes.push('<div class="mp-aviso grave"><b>Revisar el libro: rendimiento 25/26 en <i>Inputs Generales</i>.</b> ' +
            'En ' + cos.rend_es_total.map(m => esc(m.variedad)).join(' y ') +
            ' esa celda trae los <b>kilos totales</b> de la temporada y no los kilos por hectárea. ' +
            'El modelo la multiplica por la superficie, así que la temporada 2025-2026 queda multiplicada por las hectáreas: ' +
            cos.rend_es_total.map(m => esc(m.variedad) + ' marca ' + miles(m.celda) +
                ' kg/ha donde la cosecha real da ' + miles(m.rendimiento_real)).join('; ') + '. ' +
            'Son unos <b>' + usd(exceso) + '</b> de ingresos de más en 2025-2026. ' +
            'El mapa no lo corrige: muestra el libro tal cual, y la cosecha real está en ' +
            '<i>Producción ▸ Cosecha real</i>.</div>');
    }
    if (cos.difieren_de_ficha && cos.difieren_de_ficha.length) {
        partes.push('<div class="mp-aviso"><b>Dos fuentes para las mismas temporadas.</b> ' +
            'La hoja <i>Fuente 2 Rendimientos</i> y la <i>Ficha Técnica</i> —que es la que alimenta el modelo— ' +
            'coinciden exactamente en 2025-2026, pero no en 2023-2024 ni en 2024-2025: difieren en ' +
            cos.difieren_de_ficha.length + ' de ' + MOD.variedades.length + ' variedades, algunas por mucho ' +
            '(Lapins 24/25: 109.950 kg según la Ficha, 406.772 según Fuente 2). ' +
            '<i>Cosecha real</i> muestra Fuente 2, cuyas hectáreas suman la superficie que se operó históricamente ' +
            '—292,23 ha—, algo más que las 284,02 que hoy modela el negocio, porque la cosecha incluye los dos ' +
            'cuarteles que hoy están arrendados.</div>');
    }
    if (cos.agrupadas && cos.agrupadas.length) {
        const porSup = cos.repartidas_por_superficie || [];
        partes.push('<div class="mp-aviso"><b>Medidas juntas, separadas con la Ficha.</b> ' +
            '<i>Fuente 2</i> lleva en una sola fila Santina con Santina Macro Túnel, y Cara Cara con ' +
            'Fukumoto. La <i>Ficha Técnica</i> sí las separa, así que el total de cada temporada —que lo ' +
            'sigue poniendo Fuente 2— se reparte con las proporciones de la Ficha. Por eso Cara Cara y ' +
            'Fukumoto salen distintos en el mapa (21.092 y 37.604 kg/ha en 2025-2026) en vez de pintados ' +
            'del mismo color. Van marcadas con * en la tabla.' +
            (porSup.length ? ' Donde la Ficha no tiene con qué repartir, el reparto es por superficie: ' +
                porSup.map(esc).join(', ') + '.' : '') + '</div>');
    }
    if (av.produccion_incoherente && av.produccion_incoherente.length) {
        partes.push('<div class="mp-aviso"><b>Revisar el libro.</b> En la hoja <i>Consolidado por variedad</i>, el bloque PRODUCCIÓN trae corridas una fila las cuatro variedades de Uva Vinífera, y la última carga el total de la especie. ' +
            'Ese corrimiento en particular no mueve la plata: ingresos, costos y EBITDA cuadran con ha × rendimiento de <i>Inputs Generales</i>. ' +
            'Lo que sí la mueve es la celda de rendimiento 25/26 de esas mismas variedades, que es el aviso de más arriba. ' +
            'El mapa despeja la producción desde los ingresos para estas cuatro: ' + av.produccion_incoherente.map(x => esc(x.split(' / ')[1])).join(', ') + '.</div>');
    }
    if (av.variedades_sin_cuartel && av.variedades_sin_cuartel.length) {
        partes.push('<div class="mp-aviso"><b>Sin polígono en el KMZ.</b> ' + av.variedades_sin_cuartel.map(esc).join(' y ') +
            ' están en el modelo pero no tienen cuartel dibujado: suman en los totales y no se pintan.</div>');
    }
    if (av.erratas_kmz && av.erratas_kmz.length) {
        // Cada una viene como "cuartel: 'mal' -> 'bien'".
        const leer = e => { const m = e.match(/^(.*): '(.*)' -> '(.*)'$/); return m ? `${esc(m[1])}: «${esc(m[2])}» por «${esc(m[3])}»` : esc(e); };
        partes.push('<div class="mp-aviso"><b>Erratas en el KMZ.</b> Se corrigen al leerlo y la ficha muestra el nombre bien escrito, ' +
            'pero conviene arreglarlas también en el archivo. ' + av.erratas_kmz.map(leer).join('; ') + '.</div>');
    }
    const rep = (GEO.avisos || {}).codigos_repetidos || [];
    if (rep.length) {
        // 8201 y 8209 vienen partidos en A y B a propósito; el resto son paños
        // distintos con el mismo rótulo. 5213 además cubre dos variedades.
        const partidos = rep.filter(c => ['8201', '8209'].includes(c));
        const otros = rep.filter(c => !partidos.includes(c));
        const lista = cs => cs.map(c => '<b>' + esc(c) + '</b>').join(cs.length > 2 ? ', ' : ' y ');
        partes.push('<div class="mp-aviso"><b>Códigos repetidos en el KMZ.</b> ' + rep.map(esc).join(', ') +
            ' aparecen en más de un polígono.' +
            (partidos.length ? ' En ' + lista(partidos) + ' es a propósito —vienen partidos en A y B—.' : '') +
            (otros.length ? ' ' + lista(otros) + (otros.length > 1 ? ' son paños distintos' : ' es un paño distinto') + ' con el mismo rótulo' +
                (otros.includes('5213') ? ', y <b>5213</b> además cubre dos variedades (Cara Cara y Fukumoto)' : '') + '.' : '') +
            ' El buscador los desempata con el ID interno.</div>');
    }
    if (GEO.suelos) {
        const g = GEO.suelos.georreferencia;
        partes.push('<div class="mp-aviso"><b>Suelos, cómo se cruzó.</b> El plano no viene georreferenciado: se ajustó con ' +
            g.puntos_usados + ' de ' + g.puntos_totales + ' códigos de cuartel comunes, con un residuo mediano de ' +
            nf(g.error_mediano_m, 0) + ' m. Cerca de un borde entre sectores, el tipo puede corresponder al vecino.</div>');
    }
    $('avisos').innerHTML = partes.join('');
}

function volarAVariedad(clave) {
    const feats = GEO.cuarteles.features.filter(f => (f.properties.modelo || []).includes(clave));
    if (!feats.length) {
        // Una variedad sin paño dibujado suma en los totales pero no hay adónde
        // volar. Un clic que no hace nada se lee como que la app falló.
        avisar('Sin polígono en el KMZ: esta variedad suma en los totales pero no se puede mostrar en el mapa.');
        return;
    }
    const lons = feats.map(f => f.properties.centro[0]), lats = feats.map(f => f.properties.centro[1]);
    map.fitBounds([[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]],
        { padding: relleno(), maxZoom: 16.5, duration: 800 });
}

/* ── Gráficos ────────────────────────────────────────────────────────────── */
const VIZ = { s1: '#2a78d6', s2: '#eb6834', s3: '#1baf7a' };

/* Línea de cero marcada en el ranking: sin ella, en una escala divergente hay
   que adivinar dónde una barra deja de sumar y empieza a restar. */
const lineaCero = {
    id: 'lineaCero',
    afterDatasetsDraw(ch) {
        const x = ch.scales.x.getPixelForValue(0);
        const { ctx, chartArea } = ch;
        ctx.save();
        ctx.strokeStyle = css('--sem-ink');
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, chartArea.top);
        ctx.lineTo(x, chartArea.bottom);
        ctx.stroke();
        ctx.restore();
    }
};

/* Línea horizontal de referencia con su rótulo. La usa la cosecha real para
   marcar dónde está la plena producción del modelo: sin ella, las barras dicen
   cuánto se cosechó pero no contra qué. */
const lineaMeta = (valor, rotulo) => ({
    id: 'lineaMeta',
    afterDatasetsDraw(ch) {
        if (valor == null || !isFinite(valor)) return;
        const y = ch.scales.y.getPixelForValue(valor);
        const { ctx, chartArea } = ch;
        if (y < chartArea.top || y > chartArea.bottom) return;
        ctx.save();
        ctx.strokeStyle = css('--sem-ink');
        ctx.setLineDash([4, 3]);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(chartArea.left, y);
        ctx.lineTo(chartArea.right, y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.font = '600 9px "Fira Sans", sans-serif';
        ctx.fillStyle = css('--sem-ink');
        ctx.textAlign = 'right';
        ctx.textBaseline = y - chartArea.top < 12 ? 'top' : 'bottom';
        ctx.fillText(rotulo, chartArea.right - 2, y - 2);
        ctx.restore();
    }
});

function rangoY(valores) {
    const v = valores.filter(x => x != null && isFinite(x));
    if (!v.length) return {};
    const alto = Math.max(...v), bajo = Math.min(0, ...v);
    const amplitud = (alto - bajo) || 1;
    // El paso se busca para ocho intervalos, no para cuatro. Con pasos gruesos
    // el piso cae muy por debajo del dato -un EBITDA de −0,17 M arrastraba el
    // eje hasta −2 M y dejaba en blanco un quinto del gráfico-.
    const decada = Math.pow(10, Math.floor(Math.log10(amplitud / 8)));
    const paso = [1, 2, 2.5, 5, 10].map(m => m * decada).find(x => amplitud / x <= 8) || decada * 10;
    return { min: Math.floor(bajo / paso) * paso, max: Math.ceil(alto / paso) * paso, paso };
}

function ejes() {
    const tick = { color: css('--viz-muted'), font: { family: 'Fira Sans', size: 10 } };
    return {
        base: { grid: { color: css('--viz-grid'), drawTicks: false }, border: { color: css('--viz-axis') }, ticks: tick },
        tick
    };
}

const COMUN_CHART = () => ({
    maintainAspectRatio: false,
    // Sin animación. Chart.js dibuja las barras en su posición inicial y las
    // lleva a la final con requestAnimationFrame; si la pestaña no está
    // pintando, esos frames no llegan y el gráfico queda en blanco con los
    // datos correctos por dentro. Además, al cambiar de modo el panel se
    // rehace entero y la animación sólo agrega una espera.
    animation: false,
    plugins: {
        legend: { display: false },
        tooltip: {
            backgroundColor: css('--sem-ink'), padding: 9, cornerRadius: 6,
            titleFont: { family: 'Fira Sans', size: 11, weight: '600' },
            bodyFont: { family: 'Fira Sans', size: 11 },
            displayColors: false
        }
    }
});

/* Barras horizontales: una categoría por fila, con su color y su valor. Sirve
   para los tres repartos -especie, pendiente y suelo- que sólo cambian en qué
   miden. */
function barrasHorizontales(cv, filas, fmt, titulo) {
    const { base, tick } = ejes();
    const r = rangoY(filas.map(f => f.valor));
    return new Chart(cv, {
        type: 'bar',
        data: {
            // El eje recorta los nombres largos por la izquierda cuando no le
            // caben. Se truncan acá, con el nombre entero en el tooltip.
            labels: filas.map(f => f.nombre.length > 30 ? f.nombre.slice(0, 29) + '…' : f.nombre),
            datasets: [{
                data: filas.map(f => f.valor),
                backgroundColor: filas.map(f => f.color),
                borderRadius: 3, borderSkipped: false,
                categoryPercentage: 0.82, barPercentage: 0.9
            }]
        },
        options: {
            ...COMUN_CHART(), indexAxis: 'y',
            layout: { padding: { right: 8 } },
            plugins: {
                ...COMUN_CHART().plugins,
                tooltip: {
                    ...COMUN_CHART().plugins.tooltip,
                    callbacks: {
                        title: it => filas[it[0].dataIndex].nombre,
                        label: it => fmt(it.raw) + (filas[it.dataIndex].nota ? '  ·  ' + filas[it.dataIndex].nota : '')
                    }
                }
            },
            scales: {
                // Sin maxTicksLimit: pisa al stepSize y devuelve cortes como 44
                // o 131. Con el paso mandando, los rótulos salen redondos.
                x: { ...base, min: r.min, max: r.max, title: { display: !!titulo, text: titulo, color: css('--viz-muted'), font: { family: 'Fira Sans', size: 10 } },
                     ticks: { ...tick, stepSize: r.paso, maxRotation: 0, minRotation: 0, callback: fmt } },
                y: { ...base, grid: { display: false }, ticks: { ...tick, autoSkip: false, font: { family: 'Fira Sans', size: 10 } } }
            }
        }
    });
}

function dibujarGrafico(regs) {
    const cv = $('chart');
    if (grafico) { grafico.destroy(); grafico = null; }
    const alto = n => Math.max(180, n * 22 + 46) + 'px';
    // Van acá arriba y no junto al primer gráfico que los usa: declarados más
    // abajo, cualquier rama anterior que los tocara caía en zona muerta.
    const { base, tick } = ejes();
    const comun = COMUN_CHART();

    if (modo === 'general') {
        const datos = porEspecieVisible();
        cv.parentElement.style.height = alto(datos.length);
        grafico = barrasHorizontales(cv,
            datos.map(e => ({ nombre: e.especie, valor: +e.ha.toFixed(1),
                              color: COLOR_ESPECIE[e.especie] || css('--dat-sindato'),
                              nota: e.cuarteles + ' cuarteles' })),
            v => nf(v, 0), 'hectáreas del modelo');
        $('chartNota').textContent = 'Hectáreas por especie, según el modelo. La superficie del polígono no se usa.';
        return;
    }

    if (verTerreno()) {
        // El reparto se cuenta en cuarteles: el DEM clasifica polígonos, y
        // repartir las hectáreas de una variedad entre sus cuarteles exigiría
        // un supuesto de superficie que no tenemos.
        const clases = ['Plano', 'Suave', 'Moderada', 'Fuerte', 'Muy fuerte', 'Escarpada'];
        const tokens = ['--pen-1', '--pen-2', '--pen-3', '--pen-4', '--pen-5', '--pen-6'];
        const cuenta = {};
        cuartelesVisibles().forEach(p => {
            if (p.pendiente_clase) cuenta[p.pendiente_clase] = (cuenta[p.pendiente_clase] || 0) + 1;
        });
        const datos = clases.map((c, i) => ({ nombre: c, valor: cuenta[c] || 0, color: css(tokens[i]) }))
            .filter(d => d.valor);
        cv.parentElement.style.height = alto(datos.length);
        grafico = barrasHorizontales(cv, datos, v => nf(v, 0), 'cuarteles');
        $('chartNota').textContent = 'Cuarteles por clase de pendiente. Sobre 15% cambia la maquinaria que entra; ' +
            'sobre 25%, el sistema de plantación.';
        return;
    }

    if (verFisico()) {
        const cuenta = {};
        cuartelesVisibles().forEach(p => {
            const su = obj(p.suelo);
            if (su) cuenta[su.clase] = (cuenta[su.clase] || 0) + 1;
        });
        const datos = GEO.suelos.simbologia.filter(s => cuenta[s.clase])
            .map(s => ({ nombre: s.nombre, valor: cuenta[s.clase], color: s.color, nota: s.prof_cm + ' cm de 1er horizonte' }))
            .sort((a, b) => b.valor - a.valor);
        cv.parentElement.style.height = alto(datos.length);
        grafico = barrasHorizontales(cv, datos, v => nf(v, 0), 'cuarteles');
        $('chartNota').textContent = 'Cuarteles por tipo de suelo, con los colores del plano de la hacienda.';
        return;
    }

    if (verCosecha()) {
        const regsCos = regs.filter(v => v.cosecha);
        if (vistaGrafico === 'serie') {
            // Toneladas cosechadas por temporada, con la línea de lo que el
            // modelo pide en plena producción como referencia: la distancia
            // entre las barras y la línea es todo lo que hay que mirar acá.
            const idx = MOD.cosechas.temporadas.map((_, i) => i);
            const ton = i => regsCos.reduce((a, v) => a + (v.cosecha.kg[i] || 0), 0) / 1000;
            const meta = agregado(regs, UTILES - 1).kg / 1000;
            cv.parentElement.style.height = '236px';
            const datos = idx.map(ton);
            const r = rangoY(datos.concat([meta]));
            grafico = new Chart(cv, {
                type: 'bar',
                data: {
                    labels: MOD.cosechas.temporadas.map(x => x.replace('-', '/')),
                    datasets: [{ data: datos, backgroundColor: VIZ.s1, borderRadius: 3,
                                 borderSkipped: false, categoryPercentage: 0.66, barPercentage: 0.9 }]
                },
                options: {
                    ...comun,
                    plugins: {
                        ...comun.plugins,
                        tooltip: { ...comun.plugins.tooltip, callbacks: {
                            title: it => MOD.cosechas.temporadas[it[0].dataIndex],
                            label: it => nf(it.raw, 0) + ' t cosechadas  ·  ' + pct(it.raw / meta) + ' de la plena producción'
                        } }
                    },
                    scales: {
                        x: { ...base, grid: { display: false }, ticks: { ...tick, maxRotation: 0, minRotation: 0 } },
                        y: { ...base, min: r.min, max: r.max,
                             ticks: { ...tick, stepSize: r.paso, callback: v => nf(v, 0) + ' t' } }
                    }
                },
                plugins: [lineaMeta(meta, 'Plena producción del modelo')]
            });
            $('chartNota').textContent = 'Toneladas efectivamente cosechadas, de la hoja «Fuente 2 Rendimientos». ' +
                'La línea es lo que el modelo asume en plena producción: ' + miles(meta) + ' t.';
            return;
        }
        const filas = regsCos.filter(v => v.cosecha.rend_kg_ha[tc] != null)
            .sort((a, b) => a.cosecha.rend_kg_ha[tc] - b.cosecha.rend_kg_ha[tc]);
        cv.parentElement.style.height = alto(filas.length * 0.73);
        grafico = barrasHorizontales(cv, filas.map(v => ({
            nombre: v.variedad,
            valor: enUnidad(v.cosecha.rend_kg_ha[tc], UNIDAD.factor),
            color: colorEscala(enUnidad(v.cosecha.rend_kg_ha[tc], UNIDAD.factor), UNIDAD.escala),
            nota: nf(v.ha, 1) + ' ha' + (UNIDAD.mezcla && (v.kg_por_unidad || 1) > 1
                ? '  ·  ' + miles(v.cosecha.rend_u_ha[tc]) + ' cajas/ha' : '')
        })), v => miles(v), UNIDAD.larga + ' cosechados');
        $('chartNota').textContent = 'Rendimiento cosechado en ' + MOD.cosechas.temporadas[tc] +
            '. Mismos cortes y colores que el mapa y que la producción proyectada, para poder compararlas.' +
            (UNIDAD.mezcla ? ' Va en kilos porque hay cajas y kilos encendidos a la vez; con sólo uva de mesa a la vista pasa a cajas.' : '');
        return;
    }

    // Producción y Financiero: dos vistas, por temporada y por variedad.
    const produccion = modo === 'produccion';
    const barra = { borderRadius: 3, borderSkipped: false, categoryPercentage: 0.7, barPercentage: 0.9 };

    if (vistaGrafico === 'serie') {
        const idx = [...Array(UTILES).keys()];
        const ton = i => regs.reduce((a, v) => a + (v.kg[i] || 0), 0) / 1000;
        const datasets = produccion
            ? [{ label: 'Producción', data: idx.map(ton), backgroundColor: VIZ.s1, ...barra }]
            : [{ label: 'Ingresos', data: idx.map(i => agregado(regs, i).ingresos), backgroundColor: VIZ.s1, ...barra },
               { label: 'Costos',   data: idx.map(i => agregado(regs, i).costos),   backgroundColor: VIZ.s2, ...barra },
