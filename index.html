<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Hacienda Chada: Huelquén — mapa interactivo

   Dos fuentes, una sola verdad por dimensión:
     geo_data.json     geometría e identidad de cuartel (derivado del KMZ)
     modelo_data.json  superficie, producción, ingresos, costos y EBITDA
                       (derivado del modelo financiero)

   La superficie SIEMPRE es la del modelo: 292,23 ha productivas. El KMZ no
   aporta hectáreas y este archivo no las calcula: un polígono dibujado a mano
   no es una medición, y mezclar las dos haría que los totales del mapa y los
   del modelo no cuadren.
   ═══════════════════════════════════════════════════════════════════════════ */

mapboxgl.accessToken = 'pk.eyJ1Ijoicm9sYW5kb3BpbmEiLCJhIjoiY21ydTF0OWVlMDMwNjM2cHgwdTd4NGVzZSJ9.zvp3ej-YuJ1lEZ3HKtlSAw';

const ESTILO_SAT   = 'mapbox://styles/mapbox/satellite-v9';
const ESTILO_CLARO = 'mapbox://styles/mapbox/light-v11';

const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const nf = (x, d = 1) => x == null ? '—' : x.toLocaleString('es-CL', { minimumFractionDigits: d, maximumFractionDigits: d });
const usd = x => x == null ? '—' : (x < 0 ? '−' : '') + 'US$ ' + Math.abs(Math.round(x)).toLocaleString('es-CL');
const pct = x => x == null ? '—' : (x * 100).toFixed(1).replace('.', ',') + '%';
const miles = x => x == null ? '—' : Math.round(x).toLocaleString('es-CL');

/* La clave de una variedad incluye su especie: "Cabernet Sauvignon" existe en
   Uva vinífera y en Disponible, y "Mixtos" en Cerezos y en Ciruelos. */
const vkey = (esp, vari) => esp + '|' + vari;

/* ── Color ──────────────────────────────────────────────────────────────────
   Las siete ranuras de especie se declaran en :root y se leen de ahí. Las
   variedades NO reciben tonos nuevos: toman el tono de su especie y se
   escalonan en luminosidad (rampa ordinal). Así el mapa se lee primero por
   especie —el tono— y después por variedad —la profundidad—, y una variedad
   nunca se disfraza de otra especie. Con más de cinco variedades en una misma
   especie los pasos quedan por debajo del ΔL de 0,06 que pide una rampa
   ordinal: ahí el color deja de bastar y cargan la etiqueta del cuartel, la
   ficha y la leyenda, que es el encoding secundario que el mapa ya trae. */
const SLOTS = [
    { L: 0.575, C: 0.163, H: 255.5 },   /* --esp-1 azul    */
    { L: 0.671, C: 0.175, H: 40.6  },   /* --esp-2 naranja */
    { L: 0.669, C: 0.141, H: 162.1 },   /* --esp-3 aqua    */
    { L: 0.764, C: 0.161, H: 75.1  },   /* --esp-4 amarillo*/
    { L: 0.716, C: 0.141, H: 357.4 },   /* --esp-5 magenta */
    { L: 0.529, C: 0.180, H: 142.5 },   /* --esp-6 verde   */
    { L: 0.433, C: 0.167, H: 283.6 }    /* --esp-7 violeta */
];
const L_CLARA = 0.76, L_OSCURA = 0.44;   /* extremos de la rampa ordinal */

function oklchHex(L, C, H) {
    const h = H * Math.PI / 180, a = C * Math.cos(h), b = C * Math.sin(h);
    const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
    const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
    const s_ = L - 0.0894841775 * a - 1.2914855480 * b;
    const l = l_ ** 3, m = m_ ** 3, s = s_ ** 3;
    const rgb = [
        4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
        -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
        -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s
    ];
    const enc = v => {
        v = Math.max(0, Math.min(1, v));
        v = v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055;
        return Math.round(Math.max(0, Math.min(1, v)) * 255);
    };
    return '#' + rgb.map(v => enc(v).toString(16).padStart(2, '0')).join('');
}

/* Baja el chroma hasta que el color entra en el gamut sRGB: al alejarse de la
   luminosidad base, el tono ya no admite la saturación original. */
function enGamut(L, C, H) {
    for (let f = 1; f >= 0.3; f -= 0.05) {
        const hex = oklchHex(L, C * f, H);
        if (!/^#(00|ff)(00|ff)(00|ff)$/.test(hex)) return hex;
    }
    return oklchHex(L, C * 0.3, H);
}

/* ── Escalas de dato ────────────────────────────────────────────────────────
   Cada escala son n cortes y n+1 colores. Los cortes son fijos y no se
   recalculan por temporada: si la escala se moviera con los datos, dos
   temporadas del mismo mapa no serían comparables, que es justo lo que uno
   quiere mirar. */
const ESCALAS = {
    ebitda_ha: {
        etiqueta: 'EBITDA / ha', titulo: 'EBITDA por hectárea', unidad: 'US$/ha', tipo: 'divergente',
        cortes: [-7500, -5000, -2500, 0, 2500, 5000, 7500],
        tokens: ['--neg-4', '--neg-3', '--neg-2', '--neg-1', '--pos-1', '--pos-2', '--pos-3', '--pos-4'],
        fmt: usd
    },
    ingreso_ha: {
        etiqueta: 'Ingresos / ha', titulo: 'Ingresos por hectárea', unidad: 'US$/ha', tipo: 'secuencial',
        cortes: [5000, 15000, 22000, 30000],
        tokens: ['--seq-1', '--seq-2', '--seq-3', '--seq-4', '--seq-5'],
        fmt: usd
    },
    costo_ha: {
        etiqueta: 'Costos / ha', titulo: 'Costos por hectárea', unidad: 'US$/ha', tipo: 'secuencial',
        cortes: [8000, 15000, 20000, 26000],
        tokens: ['--cos-1', '--cos-2', '--cos-3', '--cos-4', '--cos-5'],
        fmt: usd
    },
    margen: {
        etiqueta: 'Margen EBITDA', titulo: 'Margen EBITDA sobre ventas', unidad: '% de ventas', tipo: 'divergente',
        cortes: [-1, -0.25, 0, 0.10, 0.25],
        tokens: ['--neg-3', '--neg-2', '--neg-1', '--pos-1', '--pos-3', '--pos-4'],
        fmt: pct
    },
    rend_kg_ha: {
        etiqueta: 'Rendimiento', titulo: 'Rendimiento por hectárea', unidad: 'kg/ha', tipo: 'secuencial',
        cortes: [3000, 8000, 15000, 25000],
        tokens: ['--seq-1', '--seq-2', '--seq-3', '--seq-4', '--seq-5'],
        fmt: x => miles(x) + ' kg'
    },
    /* Los cortes de pendiente son los de manejo frutal, no cuantiles: sobre 15%
       cambia la maquinaria, sobre 25% cambia el sistema de plantación. Una
       escala que se moviera con los datos escondería justamente eso. */
    pendiente: {
        etiqueta: 'Pendiente', titulo: 'Pendiente del terreno', unidad: '% · desnivel sobre distancia', tipo: 'terreno',
        cortes: [2, 5, 10, 15, 25],
        tokens: ['--pen-1', '--pen-2', '--pen-3', '--pen-4', '--pen-5', '--pen-6'],
        fmt: x => x == null ? '—' : nf(x, 1) + '%'
    },
    elev: {
        etiqueta: 'Elevación', titulo: 'Elevación media', unidad: 'm sobre el nivel del mar', tipo: 'terreno',
        cortes: [430, 470, 520, 570],
        tokens: ['--ele-1', '--ele-2', '--ele-3', '--ele-4', '--ele-5'],
        fmt: x => miles(x) + ' m'
    },
    /* Los cortes caen entre los valores que usa la simbología (20, 25, 30, 40,
       50 y 70 cm), así que cada paso es una clase del plano y no un intervalo
       inventado. */
    suelo_prof: {
        etiqueta: 'Profundidad 1er horizonte', titulo: 'Profundidad del primer horizonte',
        unidad: 'cm de suelo antes del cambio de textura', tipo: 'suelo',
        cortes: [22, 27, 35, 45, 60],
        tokens: ['--pro-1', '--pro-2', '--pro-3', '--pro-4', '--pro-5', '--pro-6'],
        fmt: x => miles(x) + ' cm'
    }
};
const METRICAS_FIN = ['ebitda_ha', 'ingreso_ha', 'costo_ha', 'margen'];
const METRICAS_TERRENO = ['pendiente', 'elev'];
/* "clase" no es una escala: es la simbología del plano tal cual. */
const METRICAS_SUELO = ['clase', 'suelo_prof'];

/* ── Estado ─────────────────────────────────────────────────────────────── */
let GEO = null, MOD = null;
let MIDX = {};                 // clave del modelo -> registro de variedad
let VKEY_DE_MODELO = {};       // clave del modelo -> rama del KMZ que la contiene
let MODELOS_DE_VKEY = {};      // rama del KMZ -> claves del modelo que cuelgan de ella
let SIN_POLIGONO = new Set();  // ramas que el modelo tiene y el KMZ no dibuja
let COLOR_ESPECIE = {};        // especie del KMZ -> hex
let COLOR_VARIEDAD = {};       // vkey del KMZ    -> hex
let HA_ESPECIE = {}, HA_VKEY = {};   // hectáreas del modelo, agregadas al KMZ
const visibles = new Set();
let modo = 'general', modoColor = 'variedad', metrica = 'ebitda_ha', metricaTerreno = 'pendiente', metricaSuelo = 'clase', t = 3;
let SUELO = {};                // clase -> entrada de la simbología del plano
let UTILES = 1;                // temporadas hasta plena producción, inclusive
let vistaGrafico = 'serie', ordenTabla = { campo: 'ebitda_ha', asc: false };
let fijado = null, hoverId = null, estiloSatelital = true, grafico = null, relieve = false;

const escalaActiva = () => modo === 'produccion' ? ESCALAS.rend_kg_ha
    : modo === 'terreno' ? ESCALAS[metricaTerreno]
    : modo === 'suelos' ? ESCALAS[metricaSuelo] : ESCALAS[metrica];

/* El terreno viene del DEM y el suelo del plano: los dos van escritos en el
   propio cuartel y no se ponderan ni se cruzan con el modelo. */
const valorPintado = p => modo === 'terreno' ? (p[metricaTerreno] ?? null)
    : modo === 'suelos' ? ((obj(p.suelo) || {}).prof_cm ?? null)
    : valorCuartel(p, modo === 'produccion' ? 'rend_kg_ha' : metrica, t);

/* El color de un cuartel: identidad, simbología del plano o clase de escala. */
function colorCuartel(p) {
    if (modo === 'general') {
        return (modoColor === 'especie' ? COLOR_ESPECIE[p.especie]
            : COLOR_VARIEDAD[vkey(p.especie, p.variedad)]) || css('--dat-sindato');
    }
    if (modo === 'suelos' && metricaSuelo === 'clase') {
        const s = obj(p.suelo);
        return s && SUELO[s.clase] ? SUELO[s.clase].color : css('--dat-sindato');
    }
    return colorEscala(valorPintado(p), escalaActiva());
}

/* ── Mapa ───────────────────────────────────────────────────────────────── */
const map = new mapboxgl.Map({
    container: 'map', style: ESTILO_SAT,
    center: [-70.643096, -33.885441], zoom: 13.4, attributionControl: false
});
map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'bottom-left');
map.addControl(new mapboxgl.AttributionControl({ compact: true }), 'bottom-left');
map.addControl(new mapboxgl.ScaleControl({ maxWidth: 90, unit: 'metric' }), 'bottom-left');

Promise.all([
    fetch('geo_data.json').then(r => { if (!r.ok) throw new Error('geo_data.json ' + r.status); return r.json(); }),
    fetch('modelo_data.json').then(r => { if (!r.ok) throw new Error('modelo_data.json ' + r.status); return r.json(); })
]).then(([geo, mod]) => {
    GEO = geo; MOD = mod;
    MOD.variedades.forEach(v => { MIDX[vkey(v.especie, v.variedad)] = v; });
    // Hasta plena producción y nada más: de ahí en adelante las diecisiete
    // temporadas restantes repiten exactamente el mismo número, y ofrecerlas en
    // un selector hace creer que hay algo que mirar.
    const cambia = i => ['ingresos', 'costos', 'ebitda', 'produccion']
        .some(c => Math.abs((MOD.totales[c][i] || 0) - (MOD.totales[c][i + 1] || 0)) > 0.5);
    UTILES = 1;
    for (let i = 0; i < MOD.temporadas.length - 1; i++) if (cambia(i)) UTILES = i + 2;
    (GEO.suelos ? GEO.suelos.simbologia : []).forEach(s => { SUELO[s.clase] = s; });

    t = UTILES - 1;
    prepararPaletas();
    construirSelectores();
    construirLeyenda();
    construirDatalist();
    sincronizarControles();
    togglePanel(true);
    $('dataStamp').textContent = 'KMZ ' + (GEO.generated_at || '').slice(0, 10) +
        ' · Modelo ' + (MOD.generated_at || '').slice(0, 10);
    if (map.isStyleLoaded()) inicializar(); else map.on('load', inicializar);
}).catch(e => { $('loader').textContent = 'No se pudieron cargar los datos: ' + e.message; });

/* Las hectáreas del modelo se agregan al nivel del KMZ. Una variedad del
   modelo puede tocar varios cuarteles y un cuartel mixto varias variedades:
   se cuenta cada variedad una sola vez por rama, nunca por polígono. */
const ESPECIE_MODELO_A_KMZ = {};

function prepararPaletas() {
    const porEspecie = {};
    GEO.cuarteles.features.forEach(f => {
        const p = f.properties;
        const e = porEspecie[p.especie] || (porEspecie[p.especie] = { variedades: {}, claves: new Set() });
        const k = vkey(p.especie, p.variedad);
        const v = e.variedades[k] || (e.variedades[k] = { variedad: p.variedad, claves: new Set() });
        (p.modelo || []).forEach(m => {
            v.claves.add(m); e.claves.add(m);
            // Una variedad del modelo cuelga siempre de la misma rama del KMZ:
            // el primer cuartel que la nombra fija de qué color se pinta en la
            // tabla, para que tabla y mapa no muestren dos colores distintos.
            if (!VKEY_DE_MODELO[m]) VKEY_DE_MODELO[m] = k;
            if (!ESPECIE_MODELO_A_KMZ[m.split('|')[0]]) ESPECIE_MODELO_A_KMZ[m.split('|')[0]] = p.especie;
        });
    });

    // Red Globe y Lapins Injerto están en el modelo y no tienen polígono en el
    // KMZ. Si se dejan fuera del árbol, el mapa encendido entero suma 288,83 ha
    // y no las 292,23 del modelo, y ese descuadre no se explica en ninguna
    // parte. Entran como rama propia, marcadas: cuentan en los totales y no
    // pintan nada porque no hay qué pintar.
    MOD.variedades.forEach(v => {
        const clave = vkey(v.especie, v.variedad);
        if (VKEY_DE_MODELO[clave]) return;
        const espKmz = ESPECIE_MODELO_A_KMZ[v.especie] || v.especie;
        const k = vkey(espKmz, v.variedad);
        const e = porEspecie[espKmz] || (porEspecie[espKmz] = { variedades: {}, claves: new Set() });
        (e.variedades[k] || (e.variedades[k] = { variedad: v.variedad, claves: new Set() })).claves.add(clave);
        e.claves.add(clave);
        VKEY_DE_MODELO[clave] = k;
        SIN_POLIGONO.add(k);
    });

    const haDe = claves => [...claves].reduce((a, k) => a + ((MIDX[k] || {}).ha || 0), 0);
    Object.entries(porEspecie).forEach(([esp, e]) => {
        HA_ESPECIE[esp] = haDe(e.claves);
        Object.entries(e.variedades).forEach(([k, v]) => {
            HA_VKEY[k] = haDe(v.claves);
            MODELOS_DE_VKEY[k] = [...v.claves];
            visibles.add(k);
        });
    });

    // Las ranuras se asignan en orden fijo por superficie descendente y no se
    // reciclan. "Disponible" no compite por ranura: es estado, no identidad.
    const orden = Object.keys(porEspecie)
        .filter(e => HA_ESPECIE[e] > 0)
        .sort((a, b) => HA_ESPECIE[b] - HA_ESPECIE[a]);
    orden.forEach((esp, i) => {
        COLOR_ESPECIE[esp] = css('--esp-' + Math.min(i + 1, SLOTS.length));
        const slot = SLOTS[Math.min(i, SLOTS.length - 1)];
        const vars = Object.entries(porEspecie[esp].variedades)
            .sort((a, b) => HA_VKEY[b[0]] - HA_VKEY[a[0]]);
        vars.forEach(([k], j) => {
            const L = vars.length === 1 ? slot.L
                : L_CLARA - (L_CLARA - L_OSCURA) * (j / (vars.length - 1));
            COLOR_VARIEDAD[k] = enGamut(L, slot.C, slot.H);
        });
    });
    Object.keys(porEspecie).forEach(esp => {
        if (COLOR_ESPECIE[esp]) return;
        COLOR_ESPECIE[esp] = css('--dat-estado');
        Object.keys(porEspecie[esp].variedades).forEach(k => { COLOR_VARIEDAD[k] = css('--dat-estado'); });
    });
}

/* ── Valor de un cuartel ────────────────────────────────────────────────────
   Un cuartel mixto lleva varias variedades del modelo. El mapa pinta una sola
   celda, así que promedia las variedades presentes ponderando por la
   superficie que el MODELO les asigna. El margen no se promedia como razón:
   se recompone como EBITDA sobre ingresos, que es lo que significa. */
function valorCuartel(p, campo, temporada) {
    // Las props pueden venir de GEO (arreglos reales) o de un evento de Mapbox,
    // que las serializa a string. arr() normaliza las dos procedencias.
    const claves = arr(p.modelo).filter(k => MIDX[k]);
    if (!claves.length) return null;

    if (campo === 'margen') {
        let eb = 0, ing = 0;
        claves.forEach(k => { const v = MIDX[k]; eb += v.ebitda[temporada] || 0; ing += v.ingresos[temporada] || 0; });
        return ing ? eb / ing : null;
    }
    let num = 0, den = 0;
    claves.forEach(k => {
        const v = MIDX[k], x = v[campo] ? v[campo][temporada] : null;
        if (x == null) return;
        num += x * v.ha; den += v.ha;
    });
    return den ? num / den : null;
}

function colorEscala(valor, escala) {
    if (valor == null) return css('--dat-sindato');
    let i = 0;
    while (i < escala.cortes.length && valor >= escala.cortes[i]) i++;
    return css(escala.tokens[i]);
}

/* ── Capas ──────────────────────────────────────────────────────────────── */
function exprColor() {
    const pares = [];
    GEO.cuarteles.features.forEach(f => pares.push(f.properties.uid, colorCuartel(f.properties)));
    return ['match', ['get', 'uid'], ...pares, css('--dat-sindato')];
}

function exprFiltro() {
    if (visibles.size === 0) return ['boolean', false];
    return ['match', ['concat', ['get', 'especie'], '|', ['get', 'variedad']], [...visibles], true, false];
}

function montarCapas() {
    if (!GEO || map.getSource('cuarteles')) return;

    const puntos = {
        type: 'FeatureCollection',
        features: GEO.cuarteles.features.map(f => ({
            type: 'Feature', id: f.id, properties: f.properties,
            geometry: { type: 'Point', coordinates: f.properties.centro }
        }))
    };
    // Relieve. El DEM es el mismo que alimenta el cálculo de pendiente de
    // tools/terreno_to_json.py, así que lo que se ve y lo que dice la ficha
    // salen del mismo dato. El sombreado va bajo los polígonos: encima los
    // ensuciaría y el color del cuartel es lo que hay que leer.
    map.addSource('dem', {
        type: 'raster-dem', url: 'mapbox://mapbox.mapbox-terrain-dem-v1',
        tileSize: 512, maxzoom: 14
    });
    map.addLayer({
        id: 'sombreado', type: 'hillshade', source: 'dem',
        paint: {
            'hillshade-exaggeration': 0.45,
            'hillshade-shadow-color': 'rgba(26,39,51,0.55)',
            'hillshade-highlight-color': 'rgba(255,255,255,0.35)',
            'hillshade-accent-color': 'rgba(26,39,51,0.20)'
        }
    });

    map.addSource('cuarteles', { type: 'geojson', data: GEO.cuarteles, promoteId: 'uid' });
    map.addSource('etiquetas', { type: 'geojson', data: puntos });

    map.addLayer({
        id: 'cuarteles-fill', type: 'fill', source: 'cuarteles',
        paint: {
            'fill-color': exprColor(),
            'fill-opacity': ['case', ['boolean', ['feature-state', 'hover'], false], 0.85,
                             ['boolean', ['feature-state', 'fijo'], false], 0.85, 0.62]
        }
    });
    // Sobre satelital el contorno se lee en blanco; sobre la base clara
    // desaparecería, así que ahí pasa a tinta.
    const cFuerte = estiloSatelital ? '#FFFFFF' : css('--sem-ink');
    const cSuave  = estiloSatelital ? 'rgba(255,255,255,0.55)' : 'rgba(26,39,51,0.45)';
    map.addLayer({
        id: 'cuarteles-line', type: 'line', source: 'cuarteles',
        paint: {
            'line-color': ['case', ['boolean', ['feature-state', 'fijo'], false], cFuerte,
                           ['boolean', ['feature-state', 'hover'], false], cFuerte, cSuave],
            'line-width': ['case', ['boolean', ['feature-state', 'fijo'], false], 2.6,
                           ['boolean', ['feature-state', 'hover'], false], 2.2, 0.8]
        }
    });
    map.addLayer({
        id: 'cuarteles-label', type: 'symbol', source: 'etiquetas', minzoom: 14.2,
        layout: {
            'text-field': ['get', 'cuartel'],
            'text-font': ['DIN Pro Medium', 'Arial Unicode MS Regular'],
            'text-size': ['interpolate', ['linear'], ['zoom'], 14.2, 9, 17, 13],
            'text-allow-overlap': false, 'text-padding': 2
        },
        paint: { 'text-color': '#FFFFFF', 'text-halo-color': 'rgba(26,39,51,0.85)', 'text-halo-width': 1.2 }
    });

    aplicarFiltro();
    vis('cuarteles-fill',  $('swRelleno').checked);
    vis('cuarteles-line',  $('swContorno').checked);
    vis('cuarteles-label', $('swEtiquetas').checked);
    vis('sombreado',       $('swSombreado').checked);
    aplicarRelieve($('swRelieve').checked);
    if (fijado) setEstado(fijado, 'fijo', true);
}

/* El 3D se paga en legibilidad: al inclinar la cámara los cuarteles del fondo
   se aplastan y las etiquetas se amontonan. Por eso viene apagado y, cuando se
   enciende, la inclinación es moderada. */
function aplicarRelieve(on) {
    relieve = on;
    if (!map.getSource('dem')) return;
    map.setTerrain(on ? { source: 'dem', exaggeration: 1.3 } : null);
    map.easeTo({ pitch: on ? 55 : 0, duration: 600 });
}

/* Se corre una sola vez: los listeners viven en el mapa, no en el estilo.
   Cambiar de base descarta fuentes y capas, así que el remontaje se cuelga de
   'style.load'. Con 'styledata' no alcanza: se emite antes de que el estilo
   esté listo y addSource falla. */
function inicializar() {
    map.on('style.load', montarCapas);
    montarCapas();
    encuadrar(false);
    $('loader').hidden = true;

    // El canvas de Mapbox se redimensiona cuando el contenedor cambia de
    // tamaño, no cuando se lo pedimos. Al cerrar el panel, #map anima su ancho
    // durante 200 ms: un map.resize() inmediato medía el ancho de la mitad de
    // la animación y el canvas quedaba angosto, dejando una franja muerta a la
    // derecha hasta que alguien movía la ventana. El observador lo resuelve
    // para todos los casos, incluida la ventana del navegador.
    // El resize va diferido a un frame: hacerlo dentro del propio callback
    // cambia el tamaño del canvas, que está DENTRO del elemento observado, y el
    // navegador corta la notificación para no entrar en bucle. Diferido, el
    // observador cubre todos los casos: abrir y cerrar el panel, la transición
    // de 200 ms y el redimensionado de la ventana.
    let pendiente = false;
    new ResizeObserver(() => {
        if (pendiente) return;
        pendiente = true;
        requestAnimationFrame(() => { pendiente = false; map.resize(); });
    }).observe($('map'));

    map.on('mousemove', 'cuarteles-fill', onHover);
    map.on('mouseleave', 'cuarteles-fill', onLeave);
    map.on('click', 'cuarteles-fill', onClick);
    map.on('click', e => {
        if (!map.queryRenderedFeatures(e.point, { layers: ['cuarteles-fill'] }).length) desfijar();
    });
    // Mapbox emite 'mouseleave' de capa sólo si el puntero sigue sobre el
    // canvas. Al pasar del polígono a la leyenda o a los controles —que son
    // overlays HTML— no se entera, y la ficha quedaba colgada.
    $('map').addEventListener('mouseleave', onLeave);
}

/* ── Interacción ────────────────────────────────────────────────────────── */
const setEstado = (uid, clave, valor) => { if (uid != null) map.setFeatureState({ source: 'cuarteles', id: uid }, { [clave]: valor }); };

function onHover(e) {
    if (!e.features.length) return;
    const f = e.features[0];
    map.getCanvas().style.cursor = 'pointer';
    if (hoverId !== f.properties.uid) {
        setEstado(hoverId, 'hover', false);
        hoverId = f.properties.uid;
        setEstado(hoverId, 'hover', true);
    }
    if (!fijado) mostrarFicha(f.properties, e.point);
}
function onLeave() {
    map.getCanvas().style.cursor = '';
    setEstado(hoverId, 'hover', false); hoverId = null;
    if (!fijado) ocultarFicha();
}
function onClick(e) {
    if (!e.features.length) return;
    const p = e.features[0].properties;
    setEstado(fijado, 'fijo', false);
    fijado = p.uid; setEstado(fijado, 'fijo', true);
    mostrarFicha(p, e.point, true);
}
function desfijar() { setEstado(fijado, 'fijo', false); fijado = null; ocultarFicha(); }

/* Mapbox serializa los arreglos de properties a string. */
const arr = v => { try { return typeof v === 'string' ? JSON.parse(v) : (v || []); } catch (_) { return []; } };
const obj = v => { try { return typeof v === 'string' ? JSON.parse(v) : (v || null); } catch (_) { return null; } };

/* La ficha muestra SOLO lo de la pestaña activa. Apilar modelo, terreno y suelo
   en todos los modos llenaba media pantalla con datos que nadie había pedido, y
   repetía dentro del cuerpo la especie y la variedad que ya están en la
   cabecera. Cada modo trae su bloque y sus avisos; nada más. */
function mostrarFicha(p, punto, fija = false) {
    const card = $('card');
    const variedades = arr(p.variedades), cuarteles = arr(p.cuarteles);
    const regs = arr(p.modelo).map(k => MIDX[k]).filter(Boolean);
    const su = obj(p.suelo);

    const signo = x => x == null ? '' : (x < 0 ? ' neg' : ' pos');
    const kv = (k, v, cls = '') => `<div class="card-kv"><span class="card-k">${k}</span><span class="card-v${cls}">${v}</span></div>`;
    const chip = (a, b) => `<div class="card-chip"><span>${a}</span><span>${b}</span></div>`;
    const sec = (tit, html) => html ? `<div class="card-sec"><div class="card-sec-tit">${tit}</div>${html}</div>` : '';

    let cuerpo = '';
    const avisos = [];

    if (modo === 'general') {
        const ha = regs.reduce((a, v) => a + v.ha, 0);
        const uno = regs.length === 1 ? regs[0] : null;
        const pl = uno && uno.plantaciones && uno.plantaciones.length ? uno.plantaciones : null;
        // La tasación anota "-" donde no registró portainjerto: es un hueco.
        const patrones = pl ? [...new Set(pl.map(b => b.portainjerto).filter(x => x && x !== '-'))] : [];
        cuerpo =
            (regs.length ? kv('Superficie', nf(ha, 2) + ' ha') : '') +
            (uno ? kv('Plantación', esc(uno.anio_plantacion || '—')) +
                   (patrones.length ? kv('Portainjerto', esc(patrones.join(', '))) : '') +
                   (pl ? kv('Marco', esc(pl[0].marco || '—')) : '') : '') +
            (p.nota ? `<div class="card-nota">${esc(p.nota)}</div>` : '') +
            (variedades.length > 1
                ? sec('Variedades del cuartel', variedades.map((v, i) => chip(esc(v), esc(cuarteles[i] || '—'))).join(''))
                : '');
        if (!regs.length) avisos.push('Sin contraparte en el modelo: el KMZ lo agrupa como <b>Disponible</b>, arrancado o no productivo.');
        if (p.aprox) avisos.push('Cruce aproximado: el KMZ rotula <b>Cheery Moon</b> y el modelo lo lleva como <b>Cheery Treat Injerto.</b>');

    } else if (modo === 'produccion') {
        const ultima = MOD.temporadas.length - 1;
        const cajas = regs.some(v => (v.kg_por_unidad || 1) > 1);
        const hoy = valorCuartel(p, 'rend_kg_ha', t), plena = valorCuartel(p, 'rend_kg_ha', ultima);
        // La fila de plena producción sólo aparece si dice algo distinto: en una
        // variedad ya adulta repetiría el mismo número dos veces.
        cuerpo =
            kv('Rendimiento', miles(hoy) + ' kg/ha') +
            (Math.round(plena) !== Math.round(hoy) ? kv('En plena producción', miles(plena) + ' kg/ha') : '') +
            (cajas ? `<div class="card-suelo-desc">El modelo lleva esta variedad en cajas de 8,2 kg; acá va convertido.</div>` : '') +
            (regs.length > 1 ? sec('Por variedad', regs.map(v =>
                chip(esc(v.variedad), miles(v.rend_kg_ha[t]) + ' kg/ha')).join('')) : '');
        if (regs.some(v => v.produccion_libro)) avisos.push('Producción despejada desde los ingresos: el bloque del libro trae corridas las filas de Uva Vinífera.');

    } else if (modo === 'financiero') {
        const eb = valorCuartel(p, 'ebitda_ha', t), mg = valorCuartel(p, 'margen', t);
        cuerpo = regs.length
            ? kv('Ingresos', usd(valorCuartel(p, 'ingreso_ha', t)) + '/ha') +
              kv('Costos', usd(valorCuartel(p, 'costo_ha', t)) + '/ha') +
              kv('EBITDA', usd(eb) + '/ha', signo(eb)) +
              kv('Margen', pct(mg), signo(mg)) +
              (regs.length > 1 ? sec('Por variedad', regs.map(v =>
                  chip(esc(v.variedad), usd(v.ebitda_ha[t]) + '/ha')).join('')) : '')
            : '';
        if (!regs.length) avisos.push('Sin contraparte en el modelo: el KMZ lo agrupa como <b>Disponible</b>, arrancado o no productivo.');

    } else if (modo === 'terreno') {
        cuerpo =
            kv('Pendiente', nf(p.pendiente, 1) + '% · ' + esc(p.pendiente_clase)) +
            kv('Pendiente p90', nf(p.pendiente_p90, 1) + '%') +
            kv('Elevación', miles(p.elev) + ' m') +
            kv('Rango', miles(p.elev_min) + '–' + miles(p.elev_max) + ' m') +
            kv('Exposición', esc(p.exposicion || '—'));

    } else if (modo === 'suelos') {
        cuerpo = su
            ? kv('Tipo', esc((SUELO[su.clase] || {}).nombre || su.clase)) +
              kv('Textura', esc(su.textura)) +
              kv('1er horizonte', miles(su.prof_cm) + ' cm') +
              kv('Pedregosidad', esc(su.pedregosidad)) +
              `<div class="card-suelo-desc">${esc(su.descripcion)}</div>` +
              (su.mezcla && su.mezcla.length > 1
                  ? sec('Mezcla del cuartel', su.mezcla.filter(m => m.pct >= 0.02).map(m =>
                        chip(`<i class="lg-dot" style="display:inline-block;vertical-align:-1px;margin-right:5px;background:${(SUELO[m.clase] || {}).color}"></i>` +
                             esc((SUELO[m.clase] || {}).nombre || m.clase), pct(m.pct))).join(''))
                  : '')
            : '';
        if (su && su.pct < 0.6) avisos.push('Cruza dos sectores sin que ninguno mande: la lectura buena es la mezcla, no el tipo dominante.');
    }

    card.innerHTML = `
        <div class="card-head">
            <div class="card-especie"><i class="lg-dot" style="background:${colorCuartel(p)}"></i>${esc(p.especie)}</div>
            <div class="card-cuartel">Cuartel ${esc(p.cuartel)}</div>
            <div class="card-variedad">${esc(variedades.length > 1 ? variedades.join(' · ') : p.variedad)}</div>
            <button type="button" class="card-close" id="cardClose" aria-label="Cerrar"><svg viewBox="0 0 18 18" width="13" height="13"><use href="#ic-cerrar"/></svg></button>
        </div>
        <div class="card-body">
            ${cuerpo}
            ${avisos.map(a => `<div class="card-alerta">${a}</div>`).join('')}
            <div class="card-hint">${fija ? 'Clic fuera para soltar' : 'Clic para fijar'}</div>
        </div>`;

    card.classList.toggle('fija', fija);
    card.classList.add('visible');
    if (fija) $('cardClose').onclick = desfijar;
    posicionarFicha(punto);
}

function posicionarFicha(punto) {
    const card = $('card'), r = card.getBoundingClientRect();
    const limite = document.body.classList.contains('panel-abierto') ? window.innerWidth - 392 : window.innerWidth;
    let x = punto.x + 16, y = punto.y + 14;
    if (x + r.width > limite - 12) x = punto.x - r.width - 16;
    if (y + r.height > window.innerHeight - 12) y = Math.max(12, window.innerHeight - r.height - 12);
    card.style.left = Math.max(12, x) + 'px';
    card.style.top = y + 'px';
}
const ocultarFicha = () => $('card').classList.remove('visible', 'fija');

/* ── Leyenda ────────────────────────────────────────────────────────────── */
function construirLeyenda() {
    // El árbol se arma de MODELOS_DE_VKEY, que ya incluye las ramas sin
    // polígono; contar sólo los cuarteles dibujados dejaría fuera justamente
    // las hectáreas que faltaban para cuadrar con el modelo.
    const porEspecie = {};
    Object.keys(MODELOS_DE_VKEY).forEach(k => {
        const [esp, variedad] = [k.slice(0, k.indexOf('|')), k.slice(k.indexOf('|') + 1)];
        const e = porEspecie[esp] || (porEspecie[esp] = { cuarteles: 0, variedades: {} });
        e.variedades[k] = { variedad, cuarteles: 0 };
    });
    GEO.cuarteles.features.forEach(f => {
        const p = f.properties, k = vkey(p.especie, p.variedad);
        const e = porEspecie[p.especie];
        if (!e) return;
        e.cuarteles++;
        if (e.variedades[k]) e.variedades[k].cuarteles++;
    });
    const orden = Object.keys(porEspecie).sort((a, b) => (HA_ESPECIE[b] || 0) - (HA_ESPECIE[a] || 0));

    $('legendBody').innerHTML = orden.map(esp => {
        const e = porEspecie[esp];
        const vars = Object.entries(e.variedades).sort((a, b) => (HA_VKEY[b[0]] || 0) - (HA_VKEY[a[0]] || 0));
        const filas = vars.map(([k, v]) => {
            const huerfana = SIN_POLIGONO.has(k);
            return `
            <div class="lg-row${huerfana ? ' sin-poligono' : ''}" data-vkey="${esc(k)}"${
                huerfana ? ' title="En el modelo pero sin polígono en el KMZ: suma en los totales y no se pinta"' : ''}>
                <i class="lg-dot" style="background:${COLOR_VARIEDAD[k]}"></i>
                <span class="lg-name">${esc(v.variedad)}</span>
                <span class="lg-meta">${HA_VKEY[k] ? nf(HA_VKEY[k], 1) + ' ha' : '—'}</span>
            </div>`;
        }).join('');
        return `<div class="lg-esp abierta" data-especie="${esc(esp)}">
                    <div class="lg-row lg-esp-row">
                        <span class="lg-caret"><svg viewBox="0 0 18 18" width="11" height="11"><use href="#ic-caret"/></svg></span>
                        <i class="lg-dot" style="background:${COLOR_ESPECIE[esp]}"></i>
                        <span class="lg-name">${esc(esp)}</span>
                        <span class="lg-meta">${e.cuarteles} · ${HA_ESPECIE[esp] ? nf(HA_ESPECIE[esp], 1) + ' ha' : 's/m'}</span>
                    </div>
                    <div class="lg-vars">${filas}</div>
                </div>`;
    }).join('');

    // Un clic en el nombre enciende o apaga; el caret sólo pliega la rama.
    $('legendBody').querySelectorAll('.lg-esp-row').forEach(row => {
        row.addEventListener('click', ev => {
            const esp = row.closest('.lg-esp');
            if (ev.target.closest('.lg-caret')) { esp.classList.toggle('abierta'); return; }
            const keys = [...esp.querySelectorAll('.lg-vars .lg-row')].map(r => r.dataset.vkey);
            const encender = keys.some(k => !visibles.has(k));
            keys.forEach(k => encender ? visibles.add(k) : visibles.delete(k));
            aplicarFiltro();
        });
    });
    $('legendBody').querySelectorAll('.lg-vars .lg-row').forEach(row => {
        row.addEventListener('click', () => {
            const k = row.dataset.vkey;
            visibles.has(k) ? visibles.delete(k) : visibles.add(k);
            aplicarFiltro();
        });
    });

    $('legendSub').textContent = MOD.variedades.length + ' variedades · ' + nf(MOD.totales.ha, 2) + ' ha';
}

/* Los puntos siguen al modo: si el mapa está pintado por especie o por una
   escala continua, una leyenda con 26 colores de variedad prometería una
   distinción que el mapa no está haciendo. */
function pintarDots() {
    const porEscala = modo !== 'general';
    document.querySelectorAll('.lg-vars .lg-row').forEach(row => {
        const k = row.dataset.vkey;
        if (SIN_POLIGONO.has(k)) return;
        const color = porEscala ? css('--dat-sindato')
            : modoColor === 'especie' ? COLOR_ESPECIE[k.split('|')[0]] : COLOR_VARIEDAD[k];
        row.querySelector('.lg-dot').style.background = color;
        row.querySelector('.lg-dot').style.opacity = porEscala ? 0.35 : '';
    });
    document.querySelectorAll('.lg-esp-row .lg-dot').forEach(dot => {
        dot.style.opacity = porEscala ? 0.35 : '';
    });
}

function pintarLeyenda() {
    document.querySelectorAll('.lg-vars .lg-row').forEach(row => {
        row.classList.toggle('off', !visibles.has(row.dataset.vkey));
    });
    document.querySelectorAll('.lg-esp').forEach(esp => {
        const keys = [...esp.querySelectorAll('.lg-vars .lg-row')].map(r => r.dataset.vkey);
        esp.querySelector('.lg-esp-row').classList.toggle('off', !keys.some(k => visibles.has(k)));
    });
}

function pintarEscala() {
    const caja = $('escala');
    if (modo === 'general') { caja.hidden = true; return; }

    // El tipo de suelo no es una escala continua: es la simbología del plano,
    // categórica, y se lista con su descripción. Los colores son los del plano
    // original, no una paleta nuestra: el que conoce el papel reconoce el mapa.
    if (modo === 'suelos' && metricaSuelo === 'clase') {
        const usados = {};
        GEO.cuarteles.features.forEach(f => {
            const s = f.properties.suelo;
            if (s && visibles.has(vkey(f.properties.especie, f.properties.variedad)))
                usados[s.clase] = (usados[s.clase] || 0) + 1;
        });
        caja.hidden = false;
        caja.innerHTML = `
            <div class="escala-tit">Tipos de suelo</div>
            <div class="escala-sub">Simbología del plano de la hacienda</div>
            <div class="escala-lista">${GEO.suelos.simbologia.filter(s => usados[s.clase]).map(s => `
                <div class="escala-fila" title="${esc(s.descripcion)}">
                    <i class="lg-dot" style="background:${s.color}"></i>
                    <span class="escala-nom">${esc(s.nombre)}</span>
                    <span class="escala-n">${usados[s.clase]}</span>
                </div>`).join('')}</div>`;
        return;
    }
    const e = escalaActiva();
    const ticks = e.cortes.map(c => e.fmt === pct ? pct(c) : (Math.abs(c) >= 1000 ? Math.round(c / 1000) + 'k' : String(c)));
    caja.hidden = false;
    caja.innerHTML = `
        <div class="escala-tit">${esc(e.titulo)}</div>
        <div class="escala-sub">${esc(e.unidad)}${e.tipo === 'terreno'
            ? ' · DEM ' + esc(GEO.terreno.fuente)
            : e.tipo === 'suelo' ? ' · plano de la hacienda'
            : ' · ' + esc(MOD.temporadas[t])}</div>
        <div class="escala-barra">${e.tokens.map(tk => `<i style="background:${css(tk)}"></i>`).join('')}</div>
        <div class="escala-ticks">${ticks.map(x => `<span>${esc(x)}</span>`).join('')}</div>
        <div class="escala-nd"><i style="background:${css('--dat-sindato')}"></i>Sin contraparte en el modelo</div>`;
}

/* El filtro es la única puerta: capas, métricas, leyenda y panel leen el mismo set. */
function aplicarFiltro() {
    const f = exprFiltro();
    ['cuarteles-fill', 'cuarteles-line', 'cuarteles-label'].forEach(id => {
        if (map.getLayer(id)) map.setFilter(id, f);
    });
    if (fijado) {
        const p = GEO.cuarteles.features.find(x => x.properties.uid === fijado);
        if (p && !visibles.has(vkey(p.properties.especie, p.properties.variedad))) desfijar();
    }
    pintarLeyenda(); pintarMetricas(); pintarPanel();
}

function repintar() {
    if (map.getLayer('cuarteles-fill')) map.setPaintProperty('cuarteles-fill', 'fill-color', exprColor());
    pintarDots(); pintarEscala(); pintarMetricas(); pintarPanel();
}

/* ── Métricas ───────────────────────────────────────────────────────────── */
/* Se leen las ramas encendidas, no los polígonos dibujados: así las dos
   variedades que el modelo tiene y el KMZ no dibuja siguen sumando. */
const clavesVisibles = () => {
    const s = new Set();
    visibles.forEach(k => (MODELOS_DE_VKEY[k] || []).forEach(m => s.add(m)));
    return [...s].map(k => MIDX[k]).filter(Boolean);
};

function agregado(regs, temporada) {
    const ha = regs.reduce((a, v) => a + v.ha, 0);
    const suma = campo => regs.reduce((a, v) => a + (v[campo][temporada] || 0), 0);
    const ingresos = suma('ingresos'), costos = suma('costos'), ebitda = suma('ebitda');
    // Los kilos se suman ya convertidos: sumar la producción cruda mezclaría
    // cajas de uva de mesa con kilos de cereza en el mismo total.
    const kg = regs.reduce((a, v) => a + (v.produccion[temporada] || 0) * (v.kg_por_unidad || 1), 0);
    return { ha, kg, ingresos, costos, ebitda, ebitda_ha: ha ? ebitda / ha : null, margen: ingresos ? ebitda / ingresos : null };
}

function pintarMetricas() {
    const regs = clavesVisibles(), a = agregado(regs, t);
    const cuarteles = GEO.cuarteles.features.filter(f => visibles.has(vkey(f.properties.especie, f.properties.variedad))).length;
    const plural = (n, s, p) => n === 1 ? s : p;
    const parcial = a.ha && a.ha < MOD.totales.ha ? ` · ${Math.round(a.ha / MOD.totales.ha * 100)}%` : '';

    if (modo === 'general') {
        $('statsBar').innerHTML = `
            <div class="stat"><span class="stat-val">${nf(a.ha, 1)}</span><span class="stat-lbl">Hectáreas${parcial}</span></div>
            <div class="stat"><span class="stat-val">${cuarteles}</span><span class="stat-lbl">${plural(cuarteles, 'Cuartel', 'Cuarteles')}</span></div>
            <div class="stat"><span class="stat-val">${regs.length}</span><span class="stat-lbl">${plural(regs.length, 'Variedad', 'Variedades')}</span></div>`;
        return;
    }
    if (modo === 'suelos') {
        const conSuelo = GEO.cuarteles.features.map(f => f.properties)
            .filter(p => visibles.has(vkey(p.especie, p.variedad)) && p.suelo);
        const tipos = new Set(conSuelo.map(p => p.suelo.clase));
        const prof = conSuelo.length ? conSuelo.reduce((a, p) => a + p.suelo.prof_cm, 0) / conSuelo.length : null;
        const someros = conSuelo.filter(p => p.suelo.prof_cm <= 25).length;
        $('statsBar').innerHTML = `
            <div class="stat"><span class="stat-val">${tipos.size}</span><span class="stat-lbl">${plural(tipos.size, 'Tipo de suelo', 'Tipos de suelo')}</span></div>
            <div class="stat"><span class="stat-val">${nf(prof, 0)}</span><span class="stat-lbl">cm 1er horizonte</span></div>
            <div class="stat"><span class="stat-val">${someros}</span><span class="stat-lbl">Cuarteles ≤ 25 cm</span></div>
            <div class="stat"><span class="stat-val">${conSuelo.length}</span><span class="stat-lbl">${plural(conSuelo.length, 'Cuartel', 'Cuarteles')}</span></div>`;
        return;
    }
    if (modo === 'terreno') {
        // El terreno se resume sobre los cuarteles dibujados, no sobre las
        // variedades: aquí la unidad es el polígono, y la pendiente se pondera
        // por superficie del modelo para que un paño de 0,4 ha no pese igual
        // que uno de 38.
        const conDem = GEO.cuarteles.features.map(f => f.properties)
            .filter(p => visibles.has(vkey(p.especie, p.variedad)) && p.pendiente != null);
        const peso = p => (p.modelo || []).reduce((a, k) => a + ((MIDX[k] || {}).ha || 0), 0) || 0.1;
        const wt = conDem.reduce((a, p) => a + peso(p), 0);
        const pend = wt ? conDem.reduce((a, p) => a + p.pendiente * peso(p), 0) / wt : null;
        const empinados = conDem.filter(p => p.pendiente >= 15).length;
        const rango = conDem.length
            ? miles(Math.min(...conDem.map(p => p.elev_min))) + '–' + miles(Math.max(...conDem.map(p => p.elev_max)))
            : '—';
        $('statsBar').innerHTML = `
            <div class="stat"><span class="stat-val">${nf(pend, 1)}</span><span class="stat-lbl">% pendiente media</span></div>
            <div class="stat"><span class="stat-val">${rango}</span><span class="stat-lbl">Elevación m</span></div>
            <div class="stat"><span class="stat-val">${empinados}</span><span class="stat-lbl">Cuarteles ≥ 15%</span></div>
            <div class="stat"><span class="stat-val">${conDem.length}</span><span class="stat-lbl">${plural(conDem.length, 'Cuartel', 'Cuarteles')}</span></div>`;
        return;
    }
    if (modo === 'produccion') {
        $('statsBar').innerHTML = `
            <div class="stat"><span class="stat-val">${nf(a.ha, 1)}</span><span class="stat-lbl">Hectáreas${parcial}</span></div>
            <div class="stat"><span class="stat-val">${nf(a.kg / 1000, 0)}</span><span class="stat-lbl">Toneladas</span></div>
            <div class="stat"><span class="stat-val">${miles(a.ha ? a.kg / a.ha : null)}</span><span class="stat-lbl">kg / ha</span></div>
            <div class="stat"><span class="stat-val">${regs.length}</span><span class="stat-lbl">${plural(regs.length, 'Variedad', 'Variedades')}</span></div>`;
        return;
    }
    $('statsBar').innerHTML = `
        <div class="stat"><span class="stat-val">${nf(a.ha, 1)}</span><span class="stat-lbl">Hectáreas${parcial}</span></div>
        <div class="stat"><span class="stat-val">${miles(a.ingresos)}</span><span class="stat-lbl">Ingresos US$</span></div>
        <div class="stat"><span class="stat-val">${miles(a.costos)}</span><span class="stat-lbl">Costos US$</span></div>
        <div class="stat"><span class="stat-val${a.ebitda < 0 ? ' neg' : ''}">${miles(a.ebitda)}</span><span class="stat-lbl">EBITDA US$</span></div>
        <div class="stat"><span class="stat-val${a.ebitda_ha < 0 ? ' neg' : ''}">${miles(a.ebitda_ha)}</span><span class="stat-lbl">EBITDA/ha</span></div>`;
}

/* ── Panel del modelo ───────────────────────────────────────────────────── */
/* ═══ Panel lateral ════════════════════════════════════════════════════════
   El panel acompaña a los cinco modos y muestra lo del modo: antes existía
   sólo en Producción y Financiero, y en los otros tres quedaba una franja
   muerta a la derecha del mapa. Cada modo trae su gráfico y su tabla. */

const TITULO_PANEL = {
    general: 'Composición del predio', produccion: 'Producción',
    financiero: 'Financiero', terreno: 'Terreno', suelos: 'Suelos'
};

/* Los cuarteles dibujados de las ramas encendidas. Terreno y suelo se miden
   por cuartel -el DEM y el plano clasifican polígonos, no variedades-, así que
   sus repartos se cuentan en cuarteles y no en hectáreas: repartir las ha de
   una variedad entre sus cuarteles exigiría un supuesto que nadie pidió. */
const cuartelesVisibles = () => GEO.cuarteles.features
    .map(f => f.properties)
    .filter(p => visibles.has(vkey(p.especie, p.variedad)));

/* Agregado por especie del KMZ, con las hectáreas del modelo. */
function porEspecieVisible() {
    const out = {};
    cuartelesVisibles().forEach(p => {
        const e = out[p.especie] || (out[p.especie] = {
            especie: p.especie, cuarteles: 0, claves: new Set(),
            pend: [], elev: [], prof: []
        });
        e.cuarteles++;
        arr(p.modelo).forEach(k => e.claves.add(k));
        if (p.pendiente != null) { e.pend.push(p.pendiente); e.elev.push(p.elev); }
        const su = obj(p.suelo);
        if (su) e.prof.push(su.prof_cm);
    });
    const media = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
    return Object.values(out).map(e => ({
        ...e,
        ha: [...e.claves].reduce((a, k) => a + ((MIDX[k] || {}).ha || 0), 0),
        pendiente: media(e.pend), elevacion: media(e.elev), profundidad: media(e.prof)
    })).sort((a, b) => b.ha - a.ha);
}

function pintarPanel() {
    if (!document.body.classList.contains('panel-abierto')) return;
    const regs = clavesVisibles();
    $('mpTitulo').textContent = TITULO_PANEL[modo] || 'Modelo';
    // Sólo la temporada, y sólo donde la hay: las hectáreas encendidas ya están
    // en la barra de métricas.
    $('mpSub').textContent = (modo === 'produccion' || modo === 'financiero')
        ? MOD.temporadas[t] : GEO.farm.name;
    // Las dos vistas de gráfico son de Producción y Financiero; en los demás
    // modos hay una sola cosa que mostrar.
    $('mpChartTabs').hidden = !(modo === 'produccion' || modo === 'financiero');
    dibujarGrafico(regs);
    pintarTabla(regs);
    pintarConciliacion();
}

/* ── Tabla ───────────────────────────────────────────────────────────────── */
function pintarTabla(regs) {
    if (modo === 'general' || modo === 'terreno') return tablaEspecies();
    if (modo === 'suelos') return tablaSuelos();
    return tablaVariedades(regs);
}

function filaTabla(cols, ordenar, filas) {
    $('tabla').innerHTML = `
        <thead><tr>${cols.map(c => `<th data-k="${c.k}" class="${
            ordenTabla.campo === c.k ? 'orden' + (ordenTabla.asc ? ' asc' : '') : ''}">${c.t}</th>`).join('')}</tr></thead>
        <tbody>${filas}</tbody>`;
    $('tabla').querySelectorAll('th').forEach(th => th.addEventListener('click', () => {
        const k = th.dataset.k;
        ordenTabla = { campo: k, asc: ordenTabla.campo === k ? !ordenTabla.asc : k === 'variedad' || k === 'especie' };
        ordenar();
    }));
}

function ordenarPor(lista, campo, texto) {
    return [...lista].sort((x, y) => {
        const a = x[campo], b = y[campo];
        const cmp = texto ? String(a).localeCompare(String(b), 'es') : (a || 0) - (b || 0);
        return ordenTabla.asc ? cmp : -cmp;
    });
}

function tablaEspecies() {
    const terreno = modo === 'terreno';
    const cols = terreno
        ? [{ k: 'especie', t: 'Especie' }, { k: 'ha', t: 'ha' },
           { k: 'pendiente', t: 'Pendiente' }, { k: 'elevacion', t: 'Elev. m' }]
        : [{ k: 'especie', t: 'Especie' }, { k: 'cuarteles', t: 'Cuarteles' },
           { k: 'ha', t: 'ha' }, { k: 'pct', t: '% predio' }];
    if (!cols.some(c => c.k === ordenTabla.campo)) ordenTabla = { campo: 'ha', asc: false };

    const datos = porEspecieVisible();
    const total = datos.reduce((a, e) => a + e.ha, 0);
    datos.forEach(e => { e.pct = total ? e.ha / total : 0; });
    const filas = ordenarPor(datos, ordenTabla.campo, ordenTabla.campo === 'especie').map(e => `
        <tr>
            <td><i class="lg-dot" style="background:${COLOR_ESPECIE[e.especie] || css('--dat-sindato')}"></i>${esc(e.especie)}</td>
            ${terreno
                ? `<td>${nf(e.ha, 1)}</td><td>${nf(e.pendiente, 1)}%</td><td>${miles(e.elevacion)}</td>`
                : `<td>${e.cuarteles}</td><td>${nf(e.ha, 1)}</td><td>${pct(e.pct)}</td>`}
        </tr>`).join('');
    filaTabla(cols, tablaEspecies, filas);
}

function tablaSuelos() {
    const cols = [{ k: 'nombre', t: 'Tipo de suelo' }, { k: 'cuarteles', t: 'Cuarteles' },
                  { k: 'prof_cm', t: '1er horiz.' }];
    if (!cols.some(c => c.k === ordenTabla.campo)) ordenTabla = { campo: 'cuarteles', asc: false };

    const cuenta = {};
    cuartelesVisibles().forEach(p => {
        const su = obj(p.suelo);
        if (su) cuenta[su.clase] = (cuenta[su.clase] || 0) + 1;
    });
    const datos = GEO.suelos.simbologia.filter(s => cuenta[s.clase])
        .map(s => ({ ...s, cuarteles: cuenta[s.clase] }));
    const filas = ordenarPor(datos, ordenTabla.campo, ordenTabla.campo === 'nombre').map(s => `
        <tr title="${esc(s.descripcion)}">
            <td><i class="lg-dot" style="background:${s.color}"></i>${esc(s.nombre)}</td>
            <td>${s.cuarteles}</td><td>${s.prof_cm}</td>
        </tr>`).join('');
    filaTabla(cols, tablaSuelos, filas);
}

/* Las columnas son las del modo: en Producción no tiene nada que hacer una
   columna de margen, y en Financiero una de kg/ha compite con lo que el
   usuario vino a mirar. */
function tablaVariedades(regs) {
    const cols = modo === 'produccion'
        ? [{ k: 'variedad', t: 'Variedad' }, { k: 'ha', t: 'ha' },
           { k: 'rend_kg_ha', t: 'kg/ha' }, { k: 'produccion', t: 'Ton' }]
        : [{ k: 'variedad', t: 'Variedad' }, { k: 'ha', t: 'ha' },
           { k: 'costo_ha', t: 'Costo/ha' }, { k: 'ebitda_ha', t: 'EBITDA/ha' },
           { k: 'margen', t: 'Margen' }];
    if (!cols.some(c => c.k === ordenTabla.campo)) {
        ordenTabla = { campo: modo === 'produccion' ? 'rend_kg_ha' : 'ebitda_ha', asc: false };
    }
    const valor = (v, k) => k === 'variedad' ? v.variedad : (Array.isArray(v[k]) ? v[k][t] : v[k]);
    const celda = (v, k) => {
        if (k === 'variedad') return esc(v.variedad);
        if (k === 'ha') return nf(v.ha, 1);
        if (k === 'margen') return pct(v.margen[t]);
        if (k === 'produccion') return miles((v.produccion[t] || 0) * (v.kg_por_unidad || 1) / 1000);
        return miles(v[k][t]);
    };
    const filas = [...regs].sort((x, y) => {
        const a = valor(x, ordenTabla.campo), b = valor(y, ordenTabla.campo);
        const cmp = typeof a === 'string' ? a.localeCompare(b, 'es') : (a || 0) - (b || 0);
        return ordenTabla.asc ? cmp : -cmp;
    }).map(v => {
        const clave = vkey(v.especie, v.variedad);
        const color = COLOR_VARIEDAD[VKEY_DE_MODELO[clave]] || css('--dat-sindato');
        return `<tr data-variedad="${esc(clave)}">${cols.map((c, i) => {
            const neg = (c.k === 'ebitda_ha' || c.k === 'margen') && valor(v, c.k) < 0;
            return i === 0
                ? `<td><i class="lg-dot" style="background:${color}"></i>${celda(v, c.k)}</td>`
                : `<td class="${neg ? 'neg' : ''}">${celda(v, c.k)}</td>`;
        }).join('')}</tr>`;
    }).join('');
    filaTabla(cols, () => tablaVariedades(clavesVisibles()), filas);
    $('tabla').querySelectorAll('tbody tr').forEach(tr =>
        tr.addEventListener('click', () => volarAVariedad(tr.dataset.variedad)));
}

function pintarConciliacion() {
    const c = MOD.conciliacion_superficie;
    $('conc').innerHTML = c.map((r, i) => {
        const clase = r.ha < 0 ? 'resta' : (i === c.length - 1 ? 'total' : '');
        return `<tr class="${clase}"><td>${esc(r.concepto)}<br><span style="color:var(--sem-text-3);font-size:9.5px">${esc(r.nota)}</span></td><td>${nf(r.ha, 2)} ha</td></tr>`;
    }).join('');
    $('concNota').innerHTML = 'Las 292,23 ha son la base de todo el modelo. El mapa nunca usa la superficie del polígono del KMZ: ' +
        'un contorno dibujado no es una medición, y mezclarlo con la tasación descuadraría los totales.';

    const av = MOD.avisos, partes = [];
    if (av.produccion_incoherente && av.produccion_incoherente.length) {
        partes.push('<div class="mp-aviso"><b>Revisar el libro.</b> En la hoja <i>Consolidado por variedad</i>, el bloque PRODUCCIÓN trae corridas una fila las cuatro variedades de Uva Vinífera, y la última carga el total de la especie. ' +
            'Ingresos, costos y EBITDA están correctos —cuadran con ha × rendimiento de <i>Inputs Generales</i>—, así que la plata no está afectada. ' +
            'El mapa despeja la producción desde los ingresos para estas cuatro: ' + av.produccion_incoherente.map(x => esc(x.split(' / ')[1])).join(', ') + '.</div>');
    }
    if (av.variedades_sin_cuartel && av.variedades_sin_cuartel.length) {
        partes.push('<div class="mp-aviso"><b>Sin polígono en el KMZ.</b> ' + av.variedades_sin_cuartel.map(esc).join(' y ') +
            ' están en el modelo pero no tienen cuartel dibujado: suman en los totales y no se pintan.</div>');
    }
    if (GEO.suelos) {
        const g = GEO.suelos.georreferencia;
        partes.push('<div class="mp-aviso"><b>Suelos, cómo se cruzó.</b> El plano no viene georreferenciado: se ajustó con ' +
            g.puntos_usados + ' de ' + g.puntos_totales + ' códigos de cuartel comunes, con un residuo mediano de ' +
            nf(g.error_mediano_m, 0) + ' m. Cerca de un borde entre sectores, el tipo puede corresponder al vecino.</div>');
    }
    $('avisos').innerHTML = partes.join('');
}

function volarAVariedad(clave) {
    const feats = GEO.cuarteles.features.filter(f => (f.properties.modelo || []).includes(clave));
    if (!feats.length) return;
    const lons = feats.map(f => f.properties.centro[0]), lats = feats.map(f => f.properties.centro[1]);
    map.fitBounds([[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]],
        { padding: relleno(), maxZoom: 16.5, duration: 800 });
}

/* ── Gráficos ────────────────────────────────────────────────────────────── */
const VIZ = { s1: '#2a78d6', s2: '#eb6834', s3: '#1baf7a' };

/* Línea de cero marcada en el ranking: sin ella, en una escala divergente hay
   que adivinar dónde una barra deja de sumar y empieza a restar. */
const lineaCero = {
    id: 'lineaCero',
    afterDatasetsDraw(ch) {
        const x = ch.scales.x.getPixelForValue(0);
        const { ctx, chartArea } = ch;
        ctx.save();
        ctx.strokeStyle = css('--sem-ink');
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, chartArea.top);
        ctx.lineTo(x, chartArea.bottom);
        ctx.stroke();
        ctx.restore();
    }
};

function rangoY(valores) {
    const v = valores.filter(x => x != null && isFinite(x));
    if (!v.length) return {};
    const alto = Math.max(...v), bajo = Math.min(0, ...v);
    const amplitud = (alto - bajo) || 1;
    // El paso se busca para ocho intervalos, no para cuatro. Con pasos gruesos
    // el piso cae muy por debajo del dato -un EBITDA de −0,17 M arrastraba el
    // eje hasta −2 M y dejaba en blanco un quinto del gráfico-.
    const decada = Math.pow(10, Math.floor(Math.log10(amplitud / 8)));
    const paso = [1, 2, 2.5, 5, 10].map(m => m * decada).find(x => amplitud / x <= 8) || decada * 10;
    return { min: Math.floor(bajo / paso) * paso, max: Math.ceil(alto / paso) * paso, paso };
}

function ejes() {
    const tick = { color: css('--viz-muted'), font: { family: 'Fira Sans', size: 10 } };
    return {
        base: { grid: { color: css('--viz-grid'), drawTicks: false }, border: { color: css('--viz-axis') }, ticks: tick },
        tick
    };
}

const COMUN_CHART = () => ({
    maintainAspectRatio: false,
    // Sin animación. Chart.js dibuja las barras en su posición inicial y las
    // lleva a la final con requestAnimationFrame; si la pestaña no está
    // pintando, esos frames no llegan y el gráfico queda en blanco con los
    // datos correctos por dentro. Además, al cambiar de modo el panel se
    // rehace entero y la animación sólo agrega una espera.
    animation: false,
    plugins: {
        legend: { display: false },
        tooltip: {
            backgroundColor: css('--sem-ink'), padding: 9, cornerRadius: 6,
            titleFont: { family: 'Fira Sans', size: 11, weight: '600' },
            bodyFont: { family: 'Fira Sans', size: 11 },
            displayColors: false
        }
    }
});

/* Barras horizontales: una categoría por fila, con su color y su valor. Sirve
   para los tres repartos -especie, pendiente y suelo- que sólo cambian en qué
   miden. */
function barrasHorizontales(cv, filas, fmt, titulo) {
    const { base, tick } = ejes();
    const r = rangoY(filas.map(f => f.valor));
    return new Chart(cv, {
        type: 'bar',
        data: {
            // El eje recorta los nombres largos por la izquierda cuando no le
            // caben. Se truncan acá, con el nombre entero en el tooltip.
            labels: filas.map(f => f.nombre.length > 30 ? f.nombre.slice(0, 29) + '…' : f.nombre),
            datasets: [{
                data: filas.map(f => f.valor),
                backgroundColor: filas.map(f => f.color),
                borderRadius: 3, borderSkipped: false,
                categoryPercentage: 0.82, barPercentage: 0.9
            }]
        },
        options: {
            ...COMUN_CHART(), indexAxis: 'y',
            layout: { padding: { right: 8 } },
            plugins: {
                ...COMUN_CHART().plugins,
                tooltip: {
                    ...COMUN_CHART().plugins.tooltip,
                    callbacks: {
                        title: it => filas[it[0].dataIndex].nombre,
                        label: it => fmt(it.raw) + (filas[it.dataIndex].nota ? '  ·  ' + filas[it.dataIndex].nota : '')
                    }
                }
            },
            scales: {
                // Sin maxTicksLimit: pisa al stepSize y devuelve cortes como 44
                // o 131. Con el paso mandando, los rótulos salen redondos.
                x: { ...base, min: r.min, max: r.max, title: { display: !!titulo, text: titulo, color: css('--viz-muted'), font: { family: 'Fira Sans', size: 10 } },
                     ticks: { ...tick, stepSize: r.paso, maxRotation: 0, minRotation: 0, callback: fmt } },
                y: { ...base, grid: { display: false }, ticks: { ...tick, autoSkip: false, font: { family: 'Fira Sans', size: 10 } } }
            }
        }
    });
}

function dibujarGrafico(regs) {
    const cv = $('chart');
    if (grafico) { grafico.destroy(); grafico = null; }
    const alto = n => Math.max(180, n * 22 + 46) + 'px';

    if (modo === 'general') {
        const datos = porEspecieVisible();
        cv.parentElement.style.height = alto(datos.length);
        grafico = barrasHorizontales(cv,
            datos.map(e => ({ nombre: e.especie, valor: +e.ha.toFixed(1),
                              color: COLOR_ESPECIE[e.especie] || css('--dat-sindato'),
                              nota: e.cuarteles + ' cuarteles' })),
            v => nf(v, 0), 'hectáreas del modelo');
        $('chartNota').textContent = 'Hectáreas por especie, según el modelo. La superficie del polígono no se usa.';
        return;
    }

    if (modo === 'terreno') {
        // El reparto se cuenta en cuarteles: el DEM clasifica polígonos, y
        // repartir las hectáreas de una variedad entre sus cuarteles exigiría
        // un supuesto de superficie que no tenemos.
        const clases = ['Plano', 'Suave', 'Moderada', 'Fuerte', 'Muy fuerte', 'Escarpada'];
        const tokens = ['--pen-1', '--pen-2', '--pen-3', '--pen-4', '--pen-5', '--pen-6'];
        const cuenta = {};
        cuartelesVisibles().forEach(p => {
            if (p.pendiente_clase) cuenta[p.pendiente_clase] = (cuenta[p.pendiente_clase] || 0) + 1;
        });
        const datos = clases.map((c, i) => ({ nombre: c, valor: cuenta[c] || 0, color: css(tokens[i]) }))
            .filter(d => d.valor);
        cv.parentElement.style.height = alto(datos.length);
        grafico = barrasHorizontales(cv, datos, v => nf(v, 0), 'cuarteles');
        $('chartNota').textContent = 'Cuarteles por clase de pendiente. Sobre 15% cambia la maquinaria que entra; ' +
            'sobre 25%, el sistema de plantación.';
        return;
    }

    if (modo === 'suelos') {
        const cuenta = {};
        cuartelesVisibles().forEach(p => {
            const su = obj(p.suelo);
            if (su) cuenta[su.clase] = (cuenta[su.clase] || 0) + 1;
        });
        const datos = GEO.suelos.simbologia.filter(s => cuenta[s.clase])
            .map(s => ({ nombre: s.nombre, valor: cuenta[s.clase], color: s.color, nota: s.prof_cm + ' cm de 1er horizonte' }))
            .sort((a, b) => b.valor - a.valor);
        cv.parentElement.style.height = alto(datos.length);
        grafico = barrasHorizontales(cv, datos, v => nf(v, 0), 'cuarteles');
        $('chartNota').textContent = 'Cuarteles por tipo de suelo, con los colores del plano de la hacienda.';
        return;
    }

    // Producción y Financiero: dos vistas, por temporada y por variedad.
    const { base, tick } = ejes();
    const produccion = modo === 'produccion';
    const comun = COMUN_CHART();
    const barra = { borderRadius: 3, borderSkipped: false, categoryPercentage: 0.7, barPercentage: 0.9 };
    cv.parentElement.style.height = vistaGrafico === 'ranking' ? alto(regs.length * 0.73) : '236px';

    if (vistaGrafico === 'serie') {
        const idx = [...Array(UTILES).keys()];
        const ton = i => regs.reduce((a, v) => a + (v.produccion[i] || 0) * (v.kg_por_unidad || 1), 0) / 1000;
        const datasets = produccion
            ? [{ label: 'Producción', data: idx.map(ton), backgroundColor: VIZ.s1, ...barra }]
            : [{ label: 'Ingresos', data: idx.map(i => agregado(regs, i).ingresos), backgroundColor: VIZ.s1, ...barra },
               { label: 'Costos',   data: idx.map(i => agregado(regs, i).costos),   backgroundColor: VIZ.s2, ...barra },
               { label: 'EBITDA',   data: idx.map(i => agregado(regs, i).ebitda),   backgroundColor: VIZ.s3, ...barra }];

        grafico = new Chart(cv, {
            type: 'bar',
            data: { labels: idx.map(i => MOD.temporadas[i].replace('-', '/')), datasets },
            options: {
                ...comun,
                plugins: {
                    ...comun.plugins,
                    // En barras agrupadas la etiqueta no puede ir pegada a la
                    // serie, así que acá la leyenda sí hace falta.
                    legend: produccion ? { display: false } : {
                        position: 'bottom',
                        labels: { boxWidth: 8, boxHeight: 8, padding: 12, usePointStyle: true, pointStyle: 'rect', color: css('--sem-text-2'), font: { family: 'Fira Sans', size: 10 } }
                    },
                    tooltip: {
                        ...comun.plugins.tooltip,
                        callbacks: {
                            title: it => MOD.temporadas[it[0].dataIndex],
                            label: it => it.dataset.label + ': ' + (produccion ? nf(it.raw, 0) + ' t' : usd(it.raw))
                        }
                    }
                },
                scales: {
                    x: { ...base, grid: { display: false }, ticks: { ...tick, maxRotation: 0, minRotation: 0 } },
                    y: (() => {
                        const r = rangoY(datasets.flatMap(d => d.data));
                        return { ...base, min: r.min, max: r.max,
                                 ticks: { ...tick, stepSize: r.paso, maxTicksLimit: 6,
                                          callback: v => produccion ? nf(v / 1000, 0) + 'k t' : nf(v / 1e6, 1) + 'M' } };
                    })()
                }
            }
        });
        $('chartNota').textContent = (produccion ? 'Toneladas' : 'Millones de US$') +
            ' por temporada, hasta plena producción.';
        return;
    }

    const campo = produccion ? 'rend_kg_ha' : 'ebitda_ha';
    const escala = produccion ? ESCALAS.rend_kg_ha : ESCALAS.ebitda_ha;
    const filas = [...regs].sort((a, b) => (a[campo][t] || 0) - (b[campo][t] || 0));
    grafico = new Chart(cv, {
        type: 'bar',
        data: {
            labels: filas.map(v => v.variedad),
            datasets: [{
                data: filas.map(v => v[campo][t]),
                backgroundColor: filas.map(v => colorEscala(v[campo][t], escala)),
                borderRadius: 3, borderSkipped: false,
                categoryPercentage: 0.84, barPercentage: 0.88
            }]
        },
        options: {
            ...comun, indexAxis: 'y',
            layout: { padding: { right: 6 } },
            plugins: {
                ...comun.plugins,
                tooltip: {
                    ...comun.plugins.tooltip,
                    callbacks: {
                        title: it => filas[it[0].dataIndex].variedad,
                        label: it => (produccion ? miles(it.raw) + ' kg/ha' : usd(it.raw) + '/ha') +
                            '  ·  ' + nf(filas[it.dataIndex].ha, 1) + ' ha'
                    }
                }
            },
            scales: {
                x: (() => {
                    const r = rangoY(filas.map(v => v[campo][t]));
                    return { ...base, min: r.min, max: r.max,
                             ticks: { ...tick, stepSize: r.paso, maxTicksLimit: 6, maxRotation: 0, minRotation: 0,
                                      callback: v => nf(v / 1000, 0) + 'k' } };
                })(),
                y: { ...base, grid: { display: false }, ticks: { ...tick, autoSkip: false, font: { family: 'Fira Sans', size: 10 } } }
            }
        },
        plugins: produccion ? [] : [lineaCero]
    });
    $('chartNota').textContent = (produccion ? 'kg/ha' : 'US$/ha') + ' en ' + MOD.temporadas[t] +
        '. Mismos cortes y colores que el mapa.';
}

function construirSelectores() {
    $('selTemporada').innerHTML = MOD.temporadas.slice(0, UTILES).map((s, i) =>
        `<option value="${i}"${i === t ? ' selected' : ''}>${esc(s)}${i === UTILES - 1 ? ' · plena producción' : ''}</option>`).join('');
    $('selMetrica').innerHTML = METRICAS_FIN.map(m =>
        `<option value="${m}"${m === metrica ? ' selected' : ''}>${esc(ESCALAS[m].etiqueta)}</option>`).join('');
    $('selTerreno').innerHTML = METRICAS_TERRENO.map(m =>
        `<option value="${m}"${m === metricaTerreno ? ' selected' : ''}>${esc(ESCALAS[m].etiqueta)}</option>`).join('');
    $('selSuelo').innerHTML = METRICAS_SUELO.map(m =>
        `<option value="${m}"${m === metricaSuelo ? ' selected' : ''}>${

/* Qué controles corresponden al modo. Vive aparte de cambiarModo porque el
   arranque también lo necesita: al cargar, la pestaña activa es Vista general y
   nadie ha hecho clic, así que sin esto el botón Modelo quedaba visible y abría
   un panel financiero vacío. */
function sincronizarControles() {
    const conTemporada = modo === 'produccion' || modo === 'financiero';
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.modo === modo));
    document.body.classList.toggle('modo-dato', modo !== 'general');
    $('grpColor').hidden = modo !== 'general';
    $('grpMetrica').hidden = modo !== 'financiero';
    $('grpTerreno').hidden = modo !== 'terreno';
    $('grpSuelo').hidden = modo !== 'suelos';
    // El terreno y el suelo no cambian con la temporada: el selector sugeriría
    // que la pendiente se mueve entre 2025 y 2029.
    $('grpTemporada').hidden = !conTemporada;
}

function cambiarModo(nuevo) {
    modo = nuevo;
    sincronizarControles();
    repintar();
}

function togglePanel(abrir) {
    document.body.classList.toggle('panel-abierto', abrir);
    $('btnPanel').classList.toggle('abierta', abrir);
    if (abrir) pintarPanel();
    // El ajuste fino del canvas lo hace el ResizeObserver cuando el contenedor
    // termina de animar; éste es sólo para que el mapa reaccione de inmediato.
    map.resize();
}

document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => cambiarModo(b.dataset.modo)));

$('selMetrica').addEventListener('change', e => { metrica = e.target.value; repintar(); });
$('selTerreno').addEventListener('change', e => { metricaTerreno = e.target.value; repintar(); });
$('selSuelo').addEventListener('change', e => { metricaSuelo = e.target.value; repintar(); });
$('selTemporada').addEventListener('change', e => { t = +e.target.value; repintar(); if (fijado) desfijar(); });
$('btnPanel').addEventListener('click', () => togglePanel(!document.body.classList.contains('panel-abierto')));
$('mpCerrar').addEventListener('click', () => togglePanel(false));
document.querySelectorAll('.mp-sect-head').forEach(h => h.addEventListener('click', () => {
    h.closest('.mp-sect').classList.toggle('abierta');
    if (grafico) grafico.resize();
}));
document.querySelectorAll('.mp-chart-tab').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.mp-chart-tab').forEach(x => x.classList.toggle('active', x === b));
    vistaGrafico = b.dataset.vista;
    dibujarGrafico(clavesVisibles());
}));

$('btnTodo').addEventListener('click', () => { Object.keys(COLOR_VARIEDAD).forEach(k => visibles.add(k)); aplicarFiltro(); });
$('btnNada').addEventListener('click', () => { visibles.clear(); aplicarFiltro(); });

const conmutar = (id, fn) => $(id).addEventListener('change', e => fn(e.target.checked));
const vis = (capa, on) => { if (map.getLayer(capa)) map.setLayoutProperty(capa, 'visibility', on ? 'visible' : 'none'); };
conmutar('swRelleno',   on => vis('cuarteles-fill', on));
conmutar('swContorno',  on => vis('cuarteles-line', on));
conmutar('swEtiquetas', on => vis('cuarteles-label', on));
conmutar('swLeyenda',   on => document.body.classList.toggle('legend-off', !on));
conmutar('swMetricas',  on => { $('statsBar').style.display = on ? 'flex' : 'none'; });
conmutar('swSatelital', on => { estiloSatelital = on; map.setStyle(on ? ESTILO_SAT : ESTILO_CLARO); });
conmutar('swSombreado', on => vis('sombreado', on));
conmutar('swRelieve',   on => aplicarRelieve(on));

$('btnVista').addEventListener('click', () => {
    const pop = $('popVista'), abierto = !pop.hidden;
    pop.hidden = abierto;
    $('btnVista').classList.toggle('abierta', !abierto);
    $('btnVista').setAttribute('aria-expanded', String(!abierto));
});
document.addEventListener('click', e => {
    if (!e.target.closest('.fc-pop-wrap') && !$('popVista').hidden) {
        $('popVista').hidden = true;
        $('btnVista').classList.remove('abierta');
        $('btnVista').setAttribute('aria-expanded', 'false');
    }
});

$('btnEncuadrar').addEventListener('click', () => encuadrar(true));

/* El relleno se calcula contra el tamaño real del mapa, no con números fijos.
   Con el panel abierto el mapa baja a ~700 px y un relleno izquierdo de 300 px
   —el ancho de la leyenda— más 60 a la derecha se come más de la mitad del
   ancho: ahí Mapbox deja de encuadrar y el predio se sale de la vista. */
function relleno() {
    const c = map.getContainer(), w = c.offsetWidth, h = c.offsetHeight;
    const izq = document.body.classList.contains('legend-off') ? 24 : Math.min(300, Math.round(w * 0.3));
    const der = Math.min(60, Math.round(w * 0.08));
    return {
        left: izq, right: der,
        top: Math.min(108, Math.round(h * 0.15)),
        bottom: Math.min(80, Math.round(h * 0.12))
    };
}

function encuadrar(animar) {
    const b = GEO.bbox;
    map.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: relleno(), duration: animar ? 800 : 0 });
}

/* ── Búsqueda ───────────────────────────────────────────────────────────── */
function construirDatalist() {
    $('dlCuarteles').innerHTML = GEO.cuarteles.features
        .map(f => `<option value="${esc(f.properties.cuartel)} — ${esc(f.properties.variedad)}"></option>`).join('');
}
$('inpBuscar').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    if (q.length < 2) return;
    const f = GEO.cuarteles.features.find(x => {
        const p = x.properties;
        return (p.cuartel + ' — ' + p.variedad).toLowerCase() === q || p.cuartel.toLowerCase() === q;
    });
    if (!f) return;
    const k = vkey(f.properties.especie, f.properties.variedad);
    if (!visibles.has(k)) { visibles.add(k); aplicarFiltro(); }
    map.flyTo({ center: f.properties.centro, zoom: 16.4, duration: 900 });
    map.once('moveend', () => {
        setEstado(fijado, 'fijo', false);
        fijado = f.properties.uid; setEstado(fijado, 'fijo', true);
        mostrarFicha(f.properties, map.project(f.properties.centro), true);
    });
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') desfijar(); });
</script>
