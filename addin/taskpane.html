<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Hacienda Chada</title>
<!-- Office.js: el runtime del host (Excel) exige que la pagina lo cargue y
     llame a Office.onReady antes de considerar al add-in "listo", aunque el
     panel no lea ni escriba nada de la planilla. -->
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Arial, sans-serif; }

    #barra {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        height: 36px; padding: 0 10px; background: #2B4973; color: #fff; font-size: 12px;
    }
    #barra span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #barra a {
        flex: 0 0 auto; color: #fff; text-decoration: none;
        border: 1px solid rgba(255,255,255,0.5); border-radius: 4px; padding: 3px 8px;
        white-space: nowrap;
    }
    #barra a:hover { background: rgba(255,255,255,0.15); }

    #envoltorio { position: absolute; top: 36px; left: 0; right: 0; bottom: 0; }
    iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>
<div id="barra">
    <span>Hacienda Chada: Huelquén</span>
    <a href="https://sembrador-capital.github.io/chada-map/" target="_blank" rel="noopener">Abrir en el navegador ↗</a>
</div>
<div id="envoltorio">
    <!-- El panel no hace nada propio: es el mismo mapa publicado, mostrado
         dentro de Excel. Los datos, la logica y las actualizaciones viven
         todas en chada-map; esta pagina no duplica ninguna de las tres. -->
    <iframe src="https://sembrador-capital.github.io/chada-map/" title="Mapa interactivo Hacienda Chada"></iframe>
</div>
<script>
    Office.onReady();
</script>
</body>
</html>
